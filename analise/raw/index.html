    c.beginPath(); c.arc(540, my, 215, 0, Math.PI * 2); c.fillStyle = g; c.fill();
    c.beginPath(); c.arc(540, my, 188, 0, Math.PI * 2); c.fillStyle = NAVY; c.fill();
    c.beginPath(); c.arc(540, my, 168, 0, Math.PI * 2); c.strokeStyle = 'rgba(226,190,104,.35)'; c.lineWidth = 2; c.stroke();
    if (d.b) this.icone(c, d.b.ic, 540, my, 180, GOLD2);
    else {
      c.fillStyle = GOLD; c.font = `700 30px ${SANS}`; espacado('NÍVEL', 540, my - 92, 8);
      c.fillStyle = GOLD2; c.font = `800 200px ${SANS}`; c.fillText(String(d.L.n), 540, my + 86);
    }
    // título
    c.fillStyle = GOLD; c.font = `700 30px ${SANS}`; espacado(d.b ? 'CONQUISTA DESBLOQUEADA' : 'MINHA EVOLUÇÃO', 540, 1010, 8);
    const titulo = d.b ? d.b.nome : `Nível ${d.L.n} · ${d.L.nome}`, desc = d.b ? d.b.desc : `${fmtNum(d.L.xp)} XP de estudo acumulados`;

    if (tl.length > 2) { c.font = `600 66px ${SERIF}`; tl = linhas(titulo, 900).slice(0, 3); }

    // números
    const py = 1400, ph = 300; rr(96, py, 888, ph, 28); c.fillStyle = 'rgba(255,255,255,.05)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.10)'; c.beginPath(); c.moveTo(540, py + 28); c.lineTo(540, py + ph - 28); c.moveTo(124, py + ph / 2); c.lineTo(956, py + ph / 2); c.stroke();
    const cel = [d.b ? [String(d.L.n), 'NÍVEL'] : [fmtNum(d.L.xp), 'XP'], [`${d.metas}/${NTOTAL}`, 'METAS'], [String(d.seq), d.seq === 1 ? 'DIA SEGUIDO' : 'DIAS SEGUIDOS'], [fmtNum(d.q), 'QUESTÕES']];
    cel.forEach(([v, l], i) => { const cx = i % 2 ? 762 : 318, cy = py + (i < 2 ? 0 : ph / 2); c.fillStyle = GOLD2; c.font = `800 60px ${SANS}`; c.fillText(v, cx, cy + 84); c.fillStyle = MUT; c.font = `700 22px ${SANS}`; espacado(l, cx, cy + 122, 4); });
    // rodapé
    c.fillStyle = TXT; c.font = `600 34px ${SANS}`; c.fillText('Estudando com o Protocolo', 540, 1790);
    c.fillStyle = GOLD; c.font = `600 30px ${SANS}`; c.fillText(this.host(), 540, 1838);
    return await new Promise((ok, no) => cv.toBlob(b => b ? ok(b) : no(new Error('sem imagem')), 'image/png'));

  // desenha um ícone do app (os mesmos traços do menu) direto no canvas
  icone(c, nome, cx, cy, size, cor) {

      else { p = new Path2D(); const x = +a.x || 0, y = +a.y || 0, w = +a.width, h = +a.height, r = +a.rx || 0; if (r && p.roundRect) p.roundRect(x, y, w, h, r); else p.rect(x, y, w, h); }

  },
  podeCompartilhar() { try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/png' })], 'x.png', { type: 'image/png' })] })); } catch (e) { return false; } },
  abrir(opt) {

    openSheet(`<div class="row between"><h2>${d.b ? 'Compartilhar conquista' : 'Compartilhar evolução'}</h2><button class="btn ghost sm" data-a="close" aria-label="Fechar">${ico('x')}</button></div>

/* ---------------- DEPOIMENTO NA PRIMEIRA SEMANA ----------------
   Depois de 7 dias de uso (e pelo menos 3 dias com estudo), o app pergunta uma vez se o aluno está gostando.

let DEPO = null;

    return this.dias() >= 7 && Object.keys(activityDays()).length >= 3;
  },
  talvez() {
    if (this.agendado || !this.elegivel()) return; this.agendado = true;
    setTimeout(() => { if (parseHash().r === 'inicio' && !$('#sheetbg') && this.elegivel()) this.abrir(); }, 1800);
  },

/* ---------------- LEMBRETE DE REVISÕES (notificação) ----------------
   O aluno ativa uma vez por aparelho. O app manda para o servidor só as datas das revisões pendentes
   ({ "2026-10-12": 2 }) e o servidor avisa pela manhã nos dias com revisão (rotina diária da Vercel).
   iPhone: funciona com o app instalado na Tela de Início (iOS 16.4 ou mais novo). */
const b64ToU8 = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, ch => ch.charCodeAt(0)); };
const Lembrete = {
  ocupado: false,
  suporte() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  ios() { return /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  instalado() { return !!((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone); },
  ligado() { try { return localStorage.getItem('pe:push') === '1'; } catch (e) { return false; } },
  marcar(v) { try { localStorage.setItem('pe:push', v ? '1' : '0'); } catch (e) { } },
  estado() {
    if (Store.mode !== 'supabase' || !Store.uid) return 'indisponivel';
    if (!this.suporte()) return this.ios() && !this.instalado() ? 'instalar' : 'sem-suporte';
    if (Notification.permission === 'denied') return 'negado';
    return this.ligado() && Notification.permission === 'granted' ? 'on' : 'off';
  },
  revMap() { const m = {}; revList().forEach(x => { if (!x.at) m[x.due] = (m[x.due] || 0) + 1; }); return m; },
  async api(body) {
    const sb = window.PESupabase && window.PESupabase(); const s = sb ? (await sb.auth.getSession()).data : null;
    const tok = s && s.session && s.session.access_token; if (!tok) throw new Error('sessao');
    const r = await fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify(Object.assign({ curso: CURSO.id }, body)) });
    if (!r.ok) throw new Error('http ' + r.status); return r.json();
  },
  async inscricao(criar) {
    const reg = criar ? await navigator.serviceWorker.register('/sw.js') : await navigator.serviceWorker.getRegistration('/');
    if (!reg) return null;
    let sub = await reg.pushManager.getSubscription();
    if (!sub && criar) {
      await navigator.serviceWorker.ready;
      const r = await fetch('/api/push?acao=chave'); if (!r.ok) throw new Error('chave');
      const { chave } = await r.json();
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(chave) });
    }
    return sub;
  },
  async ativar(motivo) {
    if (this.ocupado) return; this.ocupado = true; render(true);
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { toast('Sem a permissão de notificações o app não consegue avisar. Você pode liberar depois nas configurações do navegador.', 5000); return; }
      const sub = await this.inscricao(true);
      const rev = this.revMap();
      await this.api({ acao: 'salvar', sub: sub.toJSON(), rev });
      this.marcar(true); lsSet('pushSync', { h: JSON.stringify(rev), d: TODAY() });
      this.api({ acao: 'teste', motivo: motivo || '' }).catch(() => { });
      toast(motivo ? 'Notificações ativadas neste aparelho. Mandamos um teste agora.' : 'Lembretes ativados. Mandamos uma notificação de teste agora.', 4500);
    } catch (e) { console.warn('lembrete', e); toast('Não consegui ativar agora. Confira a conexão e tente de novo.'); }
    finally { this.ocupado = false; render(true); }
  },
  async desativar() {
    if (this.ocupado) return; this.ocupado = true;
    try { const sub = await this.inscricao(false); if (sub) { await this.api({ acao: 'remover', endpoint: sub.endpoint }).catch(() => { }); await sub.unsubscribe().catch(() => { }); } } catch (e) { }
    this.marcar(false); lsSet('pushSync', null); this.ocupado = false; toast('Lembretes desativados neste aparelho.'); render(true);
  },
  async teste(motivo) { try { const r = await this.api({ acao: 'teste', motivo: motivo || '' }); toast(r && r.enviados ? 'Notificação de teste enviada.' : 'Não achei este aparelho. Desative e ative de novo.'); } catch (e) { toast('Não consegui enviar o teste agora.'); } },
  // manda as revisões pendentes quando mudam (e pelo menos uma vez por dia, para o servidor saber que o aluno segue usando)
  async sync() {
    if (this.ocupado || this.estado() !== 'on') return;
    const rev = this.revMap(), h = JSON.stringify(rev), last = lsGet('pushSync') || {};
    if (last.h === h && last.d === TODAY()) return;
    const sub = await this.inscricao(false).catch(() => null);
    if (!sub) { this.marcar(false); return; }
    await this.api({ acao: 'salvar', sub: sub.toJSON(), rev });
    lsSet('pushSync', { h, d: TODAY() });
  },
};
ACT['push-on'] = t => Lembrete.ativar(t && t.dataset.motivo);

  return `<section class="card lemb ${onde !== 'ajustes' ? 'lemb-convite' : ''}"${onde === 'inicio' ? ' style="margin-top:14px"' : onde === 'revisoes' ? ' style="margin-bottom:14px"' : ''}>${titulo}${corpo}</section>`;
}

const Tour = {

  /* abre o tour (auto: só no primeiro acesso; manual: pelo botão) */

  posicionar() {

    else if (e.key === 'ArrowLeft' && this.i > 0) { e.preventDefault(); this.mostrar(this.i - 1); }

  prox() { if (this.i >= this.ps.length - 1) this.fechar('concluiu'); else this.mostrar(this.i + 1); },

  /* primeiro acesso: espera a conta carregar (para não mostrar a quem já usa o app em outro aparelho) */
  auto() {
    if (this.on || lsGet('tourOk')) return;

/* ============================================================
   PLANO COMBINADO 2.0: Escrevente + Oficial de Justiça na mesma rotina
   COMB_MAP (comb_map.js, gerado por tools/comb_equiv.py) diz, para cada meta, quanto do conteúdo dela
   o outro curso também cobra e em quais metas. Com isso o plano:
   - junta numa META DUPLA o que é igual nos dois cursos (estuda uma vez, conclui nos dois);
   - marca como JÁ ESTUDADA a meta que o aluno já fez no outro curso (só confirma com as questões);
   - transforma a meta parcial em PONTE (mostra só os dispositivos que o outro curso não cobriu);
   - junta as revisões das metas iguais numa REVISÃO DUPLA.
   Três abas: Plano, Aproveitamento (o que é igual e o que muda) e Como estudar (guia).
   ============================================================ */
const COMB_LIM = 0.8; // a partir de 80% do conteúdo em comum, a meta conta como igual
const combCm = (c, n) => (COMB_MAP[c] || {})[String(n)] || null; // [fração, [metas do outro curso], dispositivos só deste curso]
const combOutro = c => c === 'esc' ? 'oj' : 'esc';
const combSigla = c => c === 'esc' ? 'ESC' : 'OJ';
const combClasse = (c, n) => { const v = combCm(c, n); return !v || !(v[0] > 0) ? 'novo' : v[0] >= COMB_LIM ? 'igual' : 'parcial'; };
const combFoco = () => { try { return localStorage.getItem('pe26:combFoco') || 'eq'; } catch (e) { return 'eq'; } };
function combLadoDe(c) { const [A, B] = combLados(); return A.c === c ? A : B; }
const combFeita = (L, n) => !!((L.m[n] || {}).done);

/* metas do outro curso que ficam completas ao estudar m (tudo o que elas pedem está em m ou já foi concluído) */
function combPar(L, m) {
  if (m.tipo !== 'meta') return [];
  const v = combCm(L.c, m.n); if (!v || v[0] < COMB_LIM) return [];
  const O = combLadoDe(combOutro(L.c));
  return v[1].map(Number).filter(q => {
    const w = combCm(O.c, q); if (!w || w[0] < COMB_LIM || combFeita(O, q) || !O.META[q]) return false;
    return w[1].map(Number).every(p => p === +m.n || combFeita(L, p));
  }).map(q => O.META[q]);
}
/* tudo o que a meta pede já foi concluído no outro curso */
function combJaVista(L, m) {
  if (m.tipo !== 'meta') return null;
  const v = combCm(L.c, m.n); if (!v || v[0] < COMB_LIM) return null;
  const O = combLadoDe(combOutro(L.c)), src = v[1].map(Number);
  return src.length && src.every(p => combFeita(O, p)) ? src : null;
}
/* parte do conteúdo já estudada no outro curso: mostra só o que falta */
function combPonte(L, m) {
  if (m.tipo !== 'meta') return null;
  const v = combCm(L.c, m.n); if (!v || !(v[0] > 0) || v[0] >= COMB_LIM) return null;
  const O = combLadoDe(combOutro(L.c)), vistas = v[1].map(Number).filter(p => combFeita(O, p));
  return vistas.length ? { f: v[0], vistas, falta: v[2] } : null;
}

/* fila: alterna os cursos (ou 2 para 1, conforme o foco), sem repetir o que é igual */
function combFila(k) {
  const [A, B] = combLados(), foco = combFoco();
  const pend = L => L.core.metas.filter(m => !combFeita(L, m.n));
  const pa = pend(A), pb = pend(B), usados = { esc: new Set(), oj: new Set() };
  const fa = 1 - pa.length / Math.max(1, A.core.metas.length), fb = 1 - pb.length / Math.max(1, B.core.metas.length);
  const padrao = foco === 'esc' ? [0, 0, 1] : foco === 'oj' ? [1, 1, 0] : (fa <= fb ? [0, 1] : [1, 0]);
  const out = []; let i = 0, j = 0, t = 0;
  const pula = (lst, x, L) => { while (x < lst.length && usados[L.c].has(+lst[x].n)) x++; return x; };
  while (out.length < k) {
    i = pula(pa, i, A); j = pula(pb, j, B);
    if (i >= pa.length && j >= pb.length) break;
    let lado = padrao[t++ % padrao.length];
    if (lado === 0 && i >= pa.length) lado = 1; else if (lado === 1 && j >= pb.length) lado = 0;
    const L = lado === 0 ? A : B, m = lado === 0 ? pa[i++] : pb[j++];
    usados[L.c].add(+m.n);
    const par = combPar(L, m); par.forEach(q => usados[combOutro(L.c)].add(+q.n));
    out.push({ L, m, par, ja: par.length ? null : combJaVista(L, m), ponte: combPonte(L, m) });
  }
  return out;
}
/* revisões dos dois cursos; as de metas iguais (mesma etapa R1, R2 ou R3) viram uma revisão dupla */
function combRevs() {
  const t = TODAY(), lst = [];
  combLados().forEach(L => L.core.metas.forEach(m => {
    if (m.tipo !== 'meta') return; const s = L.m[m.n] || {}; if (!s.done) return;
    [1, 2, 3].forEach(k => { const due = addDays(s.done, +L.rev[k - 1] || [1, 7, 30][k - 1]); const at = (s.r || {})[k]; if (!at && due <= addDays(t, 1)) lst.push({ L, m, k, due }); });
  }));
  lst.sort((a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : a.L.c < b.L.c ? -1 : 1);
  const usado = new Set(), out = [];
  lst.forEach((x, i) => {
    if (usado.has(i)) return; usado.add(i); const g = [x], v = combCm(x.L.c, x.m.n);
    lst.forEach((y, j) => {
      if (usado.has(j) || y.L.c === x.L.c || y.k !== x.k) return;
      const w = combCm(y.L.c, y.m.n);
      if ((v && v[0] >= COMB_LIM && v[1].includes(String(y.m.n))) || (w && w[0] >= COMB_LIM && w[1].includes(String(x.m.n)))) { g.push(y); usado.add(j); }
    });
    out.push(g);
  });
  return out;
}

function revFoco(m, k) {

    ? 'Releitura rápida, de 10 a 15 minutos: releia os artigos ★ e os que você marcou com dúvida. Preste atenção em prazos, números, quem pratica o ato e palavras como "poderá" e "deverá".'
    : 'Releitura rápida, de 10 a 15 minutos: releia o resumo e as suas anotações. Não estude tudo de novo, só reative o que você viu.';
  if (k === 2) return lei
    ? 'Questões de lei seca: refaça as que você errou e resolva de 5 a 10 novas. Em cada erro, volte ao artigo e veja qual palavra a banca trocou.'
    : 'Questões: refaça as que você errou e resolva de 5 a 10 novas. Volte ao resumo só nos pontos em que errar.';

/* ============================================================

   de revisão: ~60% das sessões nos fracos, ~25% em atenção e ~15% de manutenção dos fortes, com um simulado de
   checagem no meio e um simulado geral no fim. Cada ciclo novo refaz o diagnóstico e mostra o antes e depois.

Gamif.XP.mrS = 40; // XP por sessão do Modo Revisão (e por simulado do ciclo)
const MR_T = 24, MR_MINQ = 5, MR_MIND = 15, MR_CHK = 20; // sessões por ciclo · questões mínimas por meta e por matéria · simulado de checagem
const MR_TAG = { ALTA: 1.3, 'MÉDIA': 1, BAIXA: 0.8 };
const MR_GRUPO = { f: 'Ponto fraco', a: 'Atenção', sd: 'Medir nível', s: 'Manutenção' };
const mrAtivo = () => !!(S.modorev && S.modorev.on);
const mrCiclo = () => { const c = (S.modorev && S.modorev.ciclos) || []; return c[c.length - 1] || null; };

const mrQProva = d => { const x = SIM_PLANO.find(y => y[0] === d); return x ? x[1] : 0; };
const mrPeso = d => { const k = mrQProva(d); return k ? k / SIM_TOTAL : 0.02; };

/* ---------- diagnóstico: todo o histórico do aluno, meta por meta e matéria por matéria ---------- */
function mrDiag() {
  const P = prefs(), t = TODAY(), rec = addDays(t, -30);
  const QM = new Map(BANK() ? allQ().map(q => [q.id, q]) : []);

  const mt = n => M[n] = M[n] || { n, q: 0, a: 0, wq: 0, wa: 0, iq: 0, tq: 0, err: 0 };
  const dc = d => D[d] = D[d] || { d, q: 0, a: 0, wq: 0, wa: 0 };
  let ineN = 0, extN = 0;
  // questões do app: vale a última resposta de cada questão (refazer e acertar atualiza o diagnóstico)
  for (const id in S.questoes.a) {
    const x = S.questoes.a[id]; if (!x || x.r === BLANK || x.ok == null) continue;
    const q = QM.get(id), d = x.s || (q && qDisc(q)); ineN++;
    if (d && DISC[d]) { const y = dc(d); y.q++; y.wq++; if (x.ok) { y.a++; y.wa++; } }
    const n = q && +q.meta; if (n && META[n]) { const y = mt(n); y.q++; y.wq++; y.iq++; if (x.ok) { y.a++; y.wa++; } else if (!S.erros.dom[id]) y.err++; }
  }

  S.tec.log.forEach(e => {

    const d = e.s || (META[e.c] || {}).d; if (d && DISC[d]) { const y = dc(d); y.q += q; y.a += a; y.wq += q * w; y.wa += a * w; }
    if (e.c && META[e.c]) { const y = mt(+e.c); y.q += q; y.a += a; y.wq += q * w; y.wa += a * w; y.tq += q; }
  });
  S.erros.items.forEach(x => { if (!x.ok && x.c && META[x.c]) mt(+x.c).err++; });
  // última vez que a meta foi estudada ou revisada
  const ult = {};
  METAS_ESTUDO.forEach(n => { const s = mst(n); ult[n] = [s.done, ...Object.values(s.r || {})].filter(Boolean).sort().pop() || ''; });
  ((S.modorev && S.modorev.ciclos) || []).forEach(c => c.itens.forEach(it => { if (it.feito && it.n && it.feito > (ult[it.n] || '')) ult[it.n] = it.feito; }));
  const classe = (p, q, min) => q < min ? 'sd' : p < P.amarelo ? 'f' : p < P.verde ? 'a' : 's';
  const metas = METAS_ESTUDO.map(n => {
    const x = M[n] || { n, q: 0, a: 0, wq: 0, wa: 0, iq: 0, tq: 0, err: 0 }, m = META[n];
    const p = x.wq ? pct(x.wa, x.wq) : null, c = classe(p, x.q, MR_MINQ);
    const gap = c === 'sd' ? 0.35 : Math.max(0, (P.verde - p) / P.verde);
    const score = (gap + Math.min(0.3, x.err * 0.03)) * (0.6 + 4 * mrPeso(m.d)) * (MR_TAG[m.tag] || 1);

}

/* ---------- ciclo: sessões na ordem certa ---------- */
function mrMontar(D) {
  const ms = D.metas;
  const F = ms.filter(x => x.c === 'f').sort((a, b) => b.score - a.score);
  const A = ms.filter(x => x.c === 'a' || x.c === 'sd').sort((a, b) => b.score - a.score);
  const Fo = ms.filter(x => x.c === 's').sort((a, b) => (a.ult || '').localeCompare(b.ult || '') || (MR_TAG[META[b.n].tag] || 1) - (MR_TAG[META[a.n].tag] || 1));
  const T = Math.min(MR_T, ms.length);
  const quer = { f: Math.round(T * 0.6), a: Math.round(T * 0.25) }; quer.s = T - quer.f - quer.a;
  const tem = { f: F.length, a: A.length, s: Fo.length }, k = {};

  ['f', 'a', 's'].forEach(g => { const add = Math.min(sobra, tem[g] - k[g]); k[g] += add; sobra -= add; });

  while (k.s < Math.min(2, tem.s)) { const g = k.f >= k.a ? 'f' : 'a'; if (!k[g]) break; k[g]--; k.s++; }
  const filas = { f: F.slice(0, k.f), a: A.slice(0, k.a), s: Fo.slice(0, k.s) };
  // poucos pontos fracos: eles voltam uma segunda vez mais adiante no ciclo (repetição espaçada), no lugar de sessões de atenção,
  // para os fracos continuarem com a maior parte do ciclo
  const rep = F.length ? Math.min(F.length, Math.max(sobra, quer.f - k.f)) : 0;

    const tira = Math.max(0, rep - sobra); let t1 = Math.min(tira, Math.max(0, k.a - 2)); k.a -= t1; filas.a = filas.a.slice(0, k.a);
    let t2 = Math.min(tira - t1, Math.max(0, k.s - Math.min(2, tem.s))); k.s -= t2; filas.s = filas.s.slice(0, k.s);
    const n = Math.min(rep, sobra + t1 + t2); filas.f = filas.f.concat(F.slice(0, n)); k.f += n;

    ['f', 'a', 's'].forEach(x => { if (filas[x].length) { cur[x] += k[x]; if (!g || cur[x] > cur[g]) g = x; } });
    if (!g) break; cur[g] -= total;

    const [x] = fila.splice(j, 1); prevD = x.d;

  }

  out.splice(meio, 0, { k: 'chk' }); out.push({ k: 'sim' });

}
function mrNovoCiclo() {
  const D = mrDiag(), R = S.modorev; R.ciclos = R.ciclos || [];
  const n = R.ciclos.length + 1, itens = mrMontar(D).map((it, i) => Object.assign({ id: n + '-' + (i + 1), feito: '' }, it));
  const diag = { ineN: D.ineN, extN: D.extN, errPend: D.errPend, sims: D.sims.length, discs: D.discs.map(x => ({ d: x.d, p: x.p, q: x.q, c: x.c, fr: x.fracas.slice(0, 4), at: x.atencao.slice(0, 3) })) };
  const ant = mrCiclo(); if (ant && !ant.fim) ant.fim = TODAY();

}

/* fogos de artifício em canvas: foguetes sobem, estouram em partículas douradas, brancas, azuis e verdes e caem com gravidade */
function mrFogos(cv) {
  const ctx = cv.getContext('2d'); if (!ctx) return () => { };
  let W = 0, H = 0; const dpr = Math.min(2, window.devicePixelRatio || 1);
  const fit = () => { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  fit(); window.addEventListener('resize', fit);
  const CORES = ['#E2BE68', '#C49B36', '#FFF4D6', '#FFFFFF', '#7FB2F0', '#5BD07A', '#F2A65A'], G = 0.22, DUR = 7500;
  const fog = [], par = []; const t0 = performance.now(); let last = t0, prox = t0 + 900, vivo = true;
  const cor = () => CORES[Math.floor(Math.random() * CORES.length)];
  const lanca = () => { const alvo = H * (0.1 + Math.random() * 0.45), y = H + 6; fog.push({ x: W * (0.12 + Math.random() * 0.76), y, vx: (Math.random() - 0.5) * 1.4, vy: -Math.sqrt(2 * G * (y - alvo)), c: cor() }); };
  const estoura = f => {
    const n = 56 + Math.floor(Math.random() * 30), c1 = f.c, c2 = Math.random() < 0.5 ? cor() : c1, forca = 2.2 + Math.random() * 2.2;
    for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n + Math.random() * 0.1, v = forca * (0.55 + Math.random() * 0.5); par.push({ x: f.x, y: f.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: 1, dec: 0.009 + Math.random() * 0.008, c: i % 3 ? c1 : c2, r: 1.6 + Math.random() * 1.2 }); }
  };
  lanca(); lanca(); lanca(); // abre com três foguetes de uma vez
  const passo = now => {
    if (!vivo) return;
    const dt = Math.min(2.5, (now - last) / 16.7); last = now; const el = now - t0;
    if (el < DUR && now >= prox) { lanca(); if (Math.random() < 0.45) lanca(); prox = now + 300 + Math.random() * 420; }
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    }

  };

}

/* ---------- FSRS-5 ---------- */
const FW = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];

const daysBetween = (a, b) => Math.round((dayStart(b) - dayStart(a)) / F_DAY);

function fsrsNext(st, now, ret) {
  ret = fClamp(+ret || 0.9, 0.7, 0.97);
  const out = {}, r4 = x => Math.round(x * 1000) / 1000;
  const mk = (g, due, s, d, state, lapse, ivlD) => { out[g] = { st: [Math.round(due), r4(s), r4(d), (st ? st[3] : 0) + 1, (st ? st[4] : 0) + (lapse ? 1 : 0), now, state], ivl: due - now, days: ivlD || 0 }; };

    mk(3, now + ig * F_DAY, S0(3), FSRS.d0(3), 2, 0, ig); mk(4, now + ie * F_DAY, S0(4), FSRS.d0(4), 2, 0, ie);
    return out;
  }

    const sOf = g => t < 1 ? FSRS.short(s, g) : (g === 1 ? FSRS.fail(d, s, FSRS.R(t, s)) : FSRS.succ(d, s, FSRS.R(t, s), g));

    mk(1, now + F_MIN, sOf(1), FSRS.nextD(d, 1), state); mk(2, now + 10 * F_MIN, sOf(2), FSRS.nextD(d, 2), state);
    mk(3, now + ig * F_DAY, sOf(3), FSRS.nextD(d, 3), 2, 0, ig); mk(4, now + ie * F_DAY, sOf(4), FSRS.nextD(d, 4), 2, 0, ie);

  }

  const R = FSRS.R(t, s);

}

/* ---------- como fazer um bom flashcard ---------- */
function fGuia(full) {
  const ex = (ruim, bom) => `<div class="fc-ex"><div class="fc-exr"><span class="xs up">Evite</span><p><b>Frente:</b> ${ruim[0]}</p><p><b>Verso:</b> ${ruim[1]}</p></div><div class="fc-exb"><span class="xs up">Prefira</span><p><b>Frente:</b> ${bom[0]}</p><p><b>Verso:</b> ${bom[1]}</p></div></div>`;
  return `${full ? '<h1 style="font-size:23px">Como fazer um bom flashcard</h1>' : ''}
  <p class="ink2">Flashcard não é resumo. É uma <b>pergunta</b> que obriga você a <b>puxar da memória</b> a informação que a banca cobra. Se você só relê, o cérebro reconhece; se você tenta lembrar antes de virar, ele fixa.</p>
  <ul class="fc-rules">
    <li><b>Uma pergunta objetiva na frente.</b> Nada de "explique" ou "fale sobre". A resposta tem que caber em uma linha.</li>
    <li><b>Um fato por cartão.</b> Se a regra tem duas partes que a VUNESP troca, faça dois cartões.</li>
    <li><b>Mire no que cai:</b> prazo, número, quórum, palavra-chave literal da lei, exceção à regra, quem tem a competência e a troca que a banca costuma fazer (ex.: "poderá" por "deverá", 30 por 60 dias).</li>
    <li><b>Verso curto</b>, com a palavra-chave em destaque. Use **asteriscos duplos** para deixar em <b>negrito</b>.</li>
    <li><b>Situação que se repete</b> nas provas vira cartão de caso: "Servidor recusa ordem ilegal. Comete crime?"</li>
    <li><b>Errou uma questão?</b> Transforme o ponto do erro em cartão. É o que mais rende.</li>
  </ul>
  ${ex(['Art. 5º, XI', 'a casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou para prestar socorro, ou, durante o dia, por determinação judicial'], ['A casa pode ser invadida à noite com ordem judicial?', '<b>Não.</b> Ordem judicial só <b>durante o dia</b>. À noite: flagrante, desastre ou socorro.'])}
  ${ex(['Fale sobre o prazo da contestação', 'O réu poderá oferecer contestação, por petição, no prazo de 15 dias, cujo termo inicial será a data da audiência de conciliação ou de mediação, ou da última sessão de conciliação…'], ['Prazo da contestação no CPC?', '<b>15 dias</b> (úteis). Pegadinha: a banca troca por 10 ou 30.'])}
  <h3 class="fc-gh">Omissão de palavras (lacuna)</h3>
  <p class="ink2">É o cartão feito direto da lei seca: o texto aparece com <b>uma palavra escondida</b> e você tenta lembrar qual é. Funciona muito bem para a VUNESP, que troca uma palavra e muda o sentido da alternativa.</p>
  <ul class="fc-rules">
    <li><b>Esconda só o que a banca troca:</b> deverá x poderá, é vedado x é permitido, prazos e números, "salvo", "exceto", "somente", quem tem a competência, maioria absoluta x simples.</li>
    <li><b>Não esconda o que se completa pelo contexto</b> (artigo, preposição, a palavra que só tem uma opção possível).</li>
    <li><b>Use a dica</b> com as duas opções que confundem ("deverá ou poderá?"). O app sugere sozinho para os pares mais comuns.</li>
    <li><b>Várias lacunas no mesmo trecho viram vários cartões</b>, um para cada palavra escondida.</li>
  </ul>
  <div class="fc-ex"><div class="fc-exr"><span class="xs up">Evite</span><p>[ … ] é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador…</p><p class="xs">Qualquer um completa "a casa". O cartão não treina nada.</p></div><div class="fc-exb"><span class="xs up">Prefira</span><p>…ou para prestar socorro, ou, <span class="fc-gap">[ à noite ou durante o dia? ]</span>, por determinação judicial.</p><p class="xs">Resposta: <b>durante o dia</b> (CF, art. 5º, XI). É exatamente a troca que a banca faz.</p></div></div>
  ${full ? `<p class="small ink2" style="margin-top:14px">Dica: na lei seca, selecione o trecho com o dedo (ou o mouse) e toque em <b>Flashcard</b>: o cartão já abre em <b>Omissão de palavras</b>, e você só toca nas palavras que vão sumir. Nas questões e nos resumos, o trecho vai para o verso de um cartão de frente e verso.</p><div class="row" style="margin-top:12px"><button class="btn pri" data-a="fc-new">${ico('plus')}Criar cartão</button><a class="btn" href="#flash">Voltar</a></div>` : ''}`;
}

/* ---------- criar / editar cartão ---------- */
/* rascunho do cartão aberto no sheet: modo ('fv' frente e verso | 'o' omissão), texto, palavras marcadas e dicas */
let FNV = null;
const fTok = T => { const out = []; String(T || '').replace(/\S+/g, (w, i) => { out.push({ w, s: i, e: i + w.length }); return w; }); return out; };
/* lacunas = sequências de palavras marcadas; pontuação final fica fora da lacuna */
function fGaps() {
  const V = FNV, tk = V.tk, out = []; let i = 0;
  while (i < tk.length) {
    if (!V.mk.has(i)) { i++; continue; }
    let j = i; while (j + 1 < tk.length && V.mk.has(j + 1) && !/[,;:.!?]$/.test(tk[j].w)) j++;
    let s = tk[i].s, e = tk[j].e, a = V.T.slice(s, e);
    const tail = a.match(/[,;:.!?]+$/); if (tail) { a = a.slice(0, -tail[0].length); e -= tail[0].length; }
    if (/\)$/.test(a) && (a.match(/\(/g) || []).length < (a.match(/\)/g) || []).length) { a = a.slice(0, -1); e--; }
    if (/^\(/.test(a) && (a.match(/\(/g) || []).length > (a.match(/\)/g) || []).length) { a = a.slice(1); s++; }
    if (a.trim()) out.push({ i, j, s, e, a });
    i = j + 1;
  }
  return out;
}
function fOmiBuild() {
  const V = FNV, gs = fGaps(); let x = '', last = 0;
  gs.forEach(g => { const h = (V.hint[g.i] || '').trim().replace(/[{}]/g, ''); x += V.T.slice(last, g.s) + '{{' + g.a.replace(/[{}]/g, '') + (h ? '::' + h : '') + '}}'; last = g.e; });
  return x + V.T.slice(last);
}
/* texto com {{lacunas}} -> texto limpo + palavras marcadas + dicas */
function fOmiParse(x) {
  let T = '', rg = [], last = 0; const s = String(x || '');
  s.replace(F_OMI, (m, g, pos) => { T += s.slice(last, pos); const j = g.indexOf('::'), a = j < 0 ? g : g.slice(0, j); rg.push({ s: T.length, e: T.length + a.length, h: j < 0 ? '' : g.slice(j + 2) }); T += a; last = pos + m.length; return m; });
  T += s.slice(last);
  const tk = fTok(T), mk = new Set(), hint = {}, auto = {};
  rg.forEach(r => { let first = -1; tk.forEach((t, i) => { if (t.s < r.e && t.e > r.s) { mk.add(i); if (first < 0) first = i; } }); if (first >= 0) { hint[first] = r.h; auto[first] = '\u0000'; } });
  return { T, tk, mk, hint, auto };
}
function fOmiSet(T) {
  const V = FNV, old = V.tk || [], tk = fTok(T), mk = new Set();
  V.mk.forEach(i => { if (tk[i] && old[i] && tk[i].w === old[i].w) mk.add(i); });
  V.T = T; V.tk = tk; V.mk = mk;
}
function fOmiRender() {
  const V = FNV; if (!V) return; const box = $('#fc-toks'); if (!box) return;
  box.innerHTML = V.tk.length ? V.tk.map((t, i) => `<span class="fc-tk${V.mk.has(i) ? ' on' : ''}" data-a="fc-tk" data-i="${i}" role="button" aria-pressed="${V.mk.has(i)}">${esc(t.w)}</span>`).join(' ') : '<span class="xs muted">Cole ou escreva o trecho da lei acima.</span>';
  const gs = fGaps();
  gs.forEach(g => { const prev = V.auto[g.i]; if (prev === undefined || (prev !== '\u0000' && prev !== g.a)) { if (prev === undefined || V.hint[g.i] === fHint(prev)) V.hint[g.i] = fHint(g.a); V.auto[g.i] = g.a; } });
  const gl = $('#fc-gaps'); if (gl) gl.innerHTML = gs.map((g, n) => `<div class="fc-gapl"><span class="fc-gapn">${n + 1}</span><b title="${esc(g.a)}">${esc(short(g.a, 40))}</b><input type="text" maxlength="80" data-i="fc-hint" data-g="${g.i}" value="${esc(V.hint[g.i] || '')}" placeholder="Dica (troca da banca), opcional" aria-label="Dica da lacuna ${n + 1}"></div>`).join('');
  const c = $('#fc-ocnt'); if (c) { c.textContent = gs.length ? `${plural(gs.length, 'lacuna', 'lacunas')} = ${plural(gs.length, 'cartão', 'cartões')}` : 'Toque nas palavras que devem sumir'; c.classList.toggle('ok', !!gs.length); }
  const pv = $('#fc-oprev'); if (pv) pv.innerHTML = gs.length ? `<span class="xs up muted">Como fica o cartão 1</span><div class="fc-o">${fOmiHTML(fOmiBuild(), 1, false)}</div>` : '';
}
function fModo(m) {
  const V = FNV; if (!V) return; V.modo = m;
  $$('[data-a="fc-modo"]').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $$('[data-modo]').forEach(el => el.hidden = el.dataset.modo !== m);
  if (m === 'o') { const x = $('#fc-x'), b = $('#fc-b'); if (x && !x.value.trim() && b && b.value.trim()) { x.value = b.value.trim(); fOmiSet(x.value); } fOmiRender(); }
  else { const x = $('#fc-x'), b = $('#fc-b'); if (b && !b.value.trim() && x && x.value.trim()) { b.value = x.value.trim(); fCnt(); } }
}
ACT['fc-modo'] = t => fModo(t.dataset.m);
ACT['fc-tk'] = t => { const i = +t.dataset.i, V = FNV; if (!V) return; if (V.mk.has(i)) V.mk.delete(i); else V.mk.add(i); fOmiRender(); };
INP['fc-x'] = t => { if (!FNV) return; fOmiSet(t.value); clearTimeout(INP._fcx); INP._fcx = setTimeout(fOmiRender, 160); };
INP['fc-hint'] = t => { if (!FNV) return; FNV.hint[+t.dataset.g] = t.value; FNV.auto[+t.dataset.g] = '\u0000'; const pv = $('#fc-oprev .fc-o'); if (pv) pv.innerHTML = fOmiHTML(fOmiBuild(), 1, false); };
ACT['fc-sug'] = () => {
  const V = FNV; if (!V || !V.T.trim()) return toast('Escreva ou cole o trecho primeiro.');
  let n = 0; const ocup = new Set(V.mk);
  for (const rx of F_SUG) {
    rx.lastIndex = 0; let m;
    while ((m = rx.exec(V.T)) && n < 3) {
      const s = m.index, e = s + m[0].length, ids = V.tk.map((t, i) => (t.s < e && t.e > s) ? i : -1).filter(i => i >= 0);
      if (!ids.length || ids.some(i => ocup.has(i))) continue;
      ids.forEach(i => { V.mk.add(i); ocup.add(i); }); n++;
    }

  rd.onload = () => { try { const j = JSON.parse(rd.result); if (j.app !== CORE.app) throw 0; BK = j; $('#bk-confirm').innerHTML = `<div class="note gold" style="margin-top:12px"><b class="t">Restaurar backup de ${brY((j.em || '').slice(0, 10))}?</b>Seus dados atuais serão substituídos pelos do arquivo.<div class="row" style="margin-top:8px"><button class="btn pri sm" data-a="bk-apply">Substituir meus dados</button><button class="btn sm" data-a="bk-cancel">Cancelar</button></div></div>`; } catch (e) { toast('Este arquivo não é um backup deste app.'); } t.value = ''; };
  rd.readAsText(f);
};
ACT['bk-apply'] = () => { if (!BK) return; Object.keys(DOCS).forEach(k => { Store.S[k] = Object.assign(DOCS[k](), BK[k] || {}); save(k); }); BK = null; applyTheme(); toast('Backup restaurado'); render(true); };
ACT['bk-cancel'] = () => { BK = null; $('#bk-confirm').innerHTML = ''; };
ACT.reset = () => { if (($('#rs-txt') || {}).value.trim().toUpperCase() !== 'APAGAR') return toast('Digite APAGAR para confirmar.'); Object.keys(DOCS).forEach(k => { if (k === 'prefs') return; Store.S[k] = DOCS[k](); save(k); }); QZ = null; saveQZ(); lsSet('lvl', 1); toast('Dados apagados'); go('inicio'); };

/* ---------------- tamanho do texto (zoom de leitura) ---------------- */
const FZ_STEPS = [0.85, 0.9, 1, 1.1, 1.2, 1.3, 1.45, 1.6, 1.8];
function fzControls() {
  const z = fzOf(), P = prefs();
  return `<div class="fzrow"><button class="btn" data-a="fz" data-d="-1" aria-label="Diminuir o texto">A−</button><b data-fzval>${Math.round(z * 100)}%</b><button class="btn" data-a="fz" data-d="1" aria-label="Aumentar o texto">A+</button><button class="btn ghost sm" data-a="fz" data-d="0">Tamanho padrão</button></div>
    <div class="doc fzprev"><p><b>Art. 5º</b> Todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à vida.</p></div>
    <div class="xs up muted" style="margin:14px 0 6px">Tabelas dos resumos no celular</div>
    <div class="seg"><button class="${P.tbl !== 'scroll' ? 'on' : ''}" data-a="tbl" data-t="fit">Em cartões, cabem na tela</button><button class="${P.tbl === 'scroll' ? 'on' : ''}" data-a="tbl" data-t="scroll">Tabela larga</button></div>`;
}
ACT['fz-open'] = () => openSheet(`<div class="row between"><h2>Tamanho do texto</h2><button class="btn ghost sm" data-a="close" aria-label="Fechar">${ico('x')}</button></div>
  <p class="small ink2" style="margin:4px 0 12px">Aumente ou diminua a letra dos resumos, da lei seca e das questões. O texto se reorganiza na largura da tela, sem precisar rolar para o lado.</p>${fzControls()}`);
ACT.fz = t => {
  const d = +t.dataset.d, z = fzOf(); let i = FZ_STEPS.findIndex(x => x >= z - 0.001); if (i < 0) i = FZ_STEPS.length - 1;
  const nz = d === 0 ? 1 : FZ_STEPS[Math.max(0, Math.min(FZ_STEPS.length - 1, i + d))];
  prefs().fz = nz; applyReading(); save('prefs'); $$('[data-fzval]').forEach(v => v.textContent = Math.round(nz * 100) + '%');
};
ACT.tbl = t => { prefs().tbl = t.dataset.t; applyReading(); save('prefs'); $$('[data-a="tbl"]').forEach(b => b.classList.toggle('on', b.dataset.t === t.dataset.t)); };

/* ---------------- shell e inicialização ---------------- */
function buildShell() {
  const groups = [['Estudo', ['inicio', 'plano', 'revisoes', 'modorev', 'questoes', 'ineditas', 'pq', 'flash', 'redacao', 'erros', 'tutor']], ['Conteúdo', ['materiais', 'leis']], ['Acompanhamento', ['desempenho', 'registro', 'simulados', 'relatorio']], ['Evolução', ['conquistas', 'jogos', 'ranking']], ['Adquira também', ['combo', 'pfinal']], ['', ['conta', 'tutorial', 'cronometro', 'ajustes']]];
  if (Store.isAdmin) groups.push(['Professor', ['admin']]);
  const nav = groups.map(([g, ks]) => [g, ks.filter(navOk)]).filter(([, ks]) => ks.length).map(([g, ks]) => `${g ? `<div class="grp">${g}</div>` : '<div class="sep"></div>'}${ks.filter(k => k !== 'tutorial' || tutorialId()).map(k => { const n = NAV.find(x => x[0] === k); const tr = (k === 'combo' && !extOwns('simulados')) || (k === 'pfinal' && !extOwns('protocolo_final')); return `<a href="#${k}" data-nav="${k}" class="${k === 'admin' ? 'admin' : ''}${tr ? ' locked' : ''}">${ico(n[2])}${n[1]}${tr ? `<span class="lk">${ico('lock')}</span>` : ''}</a>`; }).join('')}`).join('');
  const L = Gamif.level();
  $('#rail').innerHTML = `<div class="brand"><b>PROTOCOLO</b><strong>${esc(CURSO.brand)}</strong><span>${esc(CURSO.brandSub)}</span></div>
    ${cursoSel('rail')}<div class="cd" data-lvlbox><strong>${L.n}</strong><span>nível · ${esc(L.nome)}<br>${fmtNum(L.xp)} XP</span></div><nav aria-label="Navegação principal">${nav}</nav>
    <div class="foot"><span class="sync"></span><button class="tb-btn tb-timer" data-a="tb-timer">${ico('clock')}<span>Cronômetro</span></button></div>`;
  $('#tabbar').innerHTML = [['inicio', 'Início', 'home'], ['plano', 'Metas', 'cal'], ['questoes', 'Questões', 'quiz'], ['materiais', 'Materiais', 'book'], ['desempenho', 'Desempenho', 'chart']].map(([k, l, i]) => `<a href="#${k}" data-nav="${k}">${ico(i)}<span>${l}</span></a>`).join('');
  $('#top').innerHTML = `<button class="tb-back" data-a="back" aria-label="Voltar" hidden>${ico('back')}</button><div class="tb-brand"><b>${esc(CURSO.marca)}</b><span class="tb-title">${esc(CURSO.titulo)}</span></div>
    <div class="tb-actions"><span class="sync" style="margin-right:4px"></span>${BETA ? `<button class="tb-btn tb-bug" data-a="bug-open" aria-label="Relatar problema" title="Relatar problema">${ico('bug')}<span>Beta</span></button>` : ''}<button class="tb-btn tb-fz" data-a="fz-open" aria-label="Tamanho do texto" title="Tamanho do texto">Aa</button><button class="tb-btn tb-timer" data-a="tb-timer" aria-label="Cronômetro">${ico('clock')}<span>Cronômetro</span></button><button class="tb-btn tb-menu" data-a="menu" aria-label="Menu">${ico('menu')}</button></div>`;
}
function refreshLevelBox() { const L = Gamif.level(); $$('[data-lvlbox]').forEach(el => el.innerHTML = `<strong>${L.n}</strong><span>nível · ${esc(L.nome)}<br>${fmtNum(L.xp)} XP</span>`); }
const _render = render;
render = function (k) { _render(k); refreshLevelBox(); };
async function initCaps() {
  if (window.PEIA && !SAMPLE) { SAMPLE = window.PEIA; softRender(); }
  const C = window.claude; if (!C || typeof C.use !== 'function') return;
  try { const [sm, dl] = await Promise.all([C.use('sample'), C.use('downloads')]); SAMPLE = sm || SAMPLE || null; DL = dl || DL || null; if (SAMPLE || DL) softRender(); } catch (e) { }
}
function boot() {
  applyTheme(); buildShell(); Store.setStatus(Store.mode === 'local' ? 'local' : 'cloud');
  render(); updTimers();
  Store.connect().then(() => {
    if (Store.adapter && Store.adapter.conta) contaLoad(true);
    if (Store.adapter && Store.adapter.extras) extrasLoad(true);
    buildShell(); Store.setStatus(Store.status); updTimers(); render(true);
    if (BETA && Store.adapter && Store.uid && !Store.isAdmin) setTimeout(() => checkReplies().catch(() => { }), 2500);
    Tour.auto(); // tour guiado: só no primeiro acesso
    if (Store.adapter && Store.adapter.avisos) Store.adapter.avisos().then(a => { AVISOS = a || []; if (AVISOS.length && parseHash().r === 'inicio') render(true); }).catch(() => { });
  });
  initCaps();
  load('questoes').catch(() => { });
  window.addEventListener('online', () => Store.resync());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Store.resync(); if (document.visibilityState === 'hidden' && Store.dirty.size) Store.flush(); if (document.visibilityState === 'visible') updTimers(); });
}
boot();


</script>
<script>(async function () {
  // cronograma do Escrevente publicado no painel e escolha do curso, em paralelo
  const pub = (async () => {
    try {
      const C = window.PEContent ? await Promise.race([window.PEContent.init(), new Promise(r => setTimeout(() => r(null), 6000))]) : null;
      if (C && C.has('data/core.json')) { const t = await C.text('data/core.json'); JSON.parse(t); document.getElementById('core').textContent = t; }
    } catch (e) { console.warn('cronograma publicado indisponível; usando o embutido', e); }
  })();
  const cur = (async () => { try { if (window.PECurso) await window.PECurso.boot(); } catch (e) { console.warn('escolha do curso falhou; abrindo o Escrevente', e); } })();
  await Promise.all([pub, cur]);
  if (window.PECurso && window.PECurso.curso === 'falha') { window.PECurso.telaFalha(); return; }
  // cronograma do Escrevente: não vem mais aberto na página. Chega cifrado (extras/escrevente-core.bin) e só abre
  // com a chave que o banco entrega a aluno ativo; o publicado no painel, se houver, tem prioridade.
  const core = document.getElementById('core'), PC = window.PECurso;
  if (!core.textContent.trim() && PC && PC.coreEsc) core.textContent = PC.coreEsc;
  if ((!PC || PC.curso !== 'oj') && !core.textContent.trim()) {
    // sem login ou sem acesso: fica só a tela de entrar / assinatura (o adaptador já mostrou); com acesso e sem cronograma: aviso
    if (PC && PC.info && PC.info.uid) PC.telaFalha('esc');
    return;
  }
  const s = document.createElement('script'); s.textContent = document.getElementById('app-src').textContent; document.body.appendChild(s);
})();</script>
