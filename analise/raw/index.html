<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D1B2A"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Protocolo Escrevente</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: app shell — navy rail on wide screens, bottom tab bar on phones; content column up to 1080px; reading views keep a ~68ch measure */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F6F7F9; --surface-3:#ECEFF3;
  --line:#E1E5EB; --line-2:#CDD3DC;
  --ink:#0D1B2A; --ink-2:#435267; --muted:#6B7A8C;
  --brand:#0D1B2A; --brand-2:#16293D; --brand-ink:#F5ECDB; --brand-mute:#9FB0C3;
  --gold:#C49B36; --gold-ink:#86620F; --gold-wash:#FBF3E1; --gold-line:#E8D3A2;
  --link:#1F5FAD;
  --ok:#0B7A28; --ok-dot:#0ca30c; --ok-wash:#E7F5EA;
  --warn:#8A5A00; --warn-dot:#fab219; --warn-wash:#FDF3DC;
  --bad:#B42318; --bad-dot:#d03b3b; --bad-wash:#FCEBEA;
  --s1:#2a78d6; --s2:#a8790c;
  --heat0:#ECEFF3; --heat1:#cde2fb; --heat2:#86b6ef; --heat3:#3987e5; --heat4:#1c5cab;
  --grid:#E6E9EE; --axis:#C3CAD4;
  --shadow:0 1px 2px rgba(13,27,42,.06),0 4px 16px rgba(13,27,42,.06);
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121C; --surface:#0F1D2B; --surface-2:#13253A; --surface-3:#1A2E44;
    --line:#203549; --line-2:#2C4560;
    --ink:#EEF1F5; --ink-2:#B9C5D3; --muted:#8798AC;
    --brand:#0A1724; --brand-2:#13263A; --brand-ink:#F5ECDB; --brand-mute:#8FA3B9;
    --gold:#D2AA4A; --gold-ink:#E2BE68; --gold-wash:#2A2415; --gold-line:#5C4A1E;
    --link:#7DB0F0;
    --ok:#5BD07A; --ok-dot:#0ca30c; --ok-wash:#11301E;
    --warn:#F2C35A; --warn-dot:#fab219; --warn-wash:#33280F;
    --bad:#F08A80; --bad-dot:#d03b3b; --bad-wash:#3A1716;
    --s1:#3987e5; --s2:#b8891f;
    --heat0:#18293B; --heat1:#163a5f; --heat2:#1c5cab; --heat3:#3987e5; --heat4:#9ec5f4;
    --grid:#1D3045; --axis:#2E4660;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121C; --surface:#0F1D2B; --surface-2:#13253A; --surface-3:#1A2E44;
  --line:#203549; --line-2:#2C4560;
  --ink:#EEF1F5; --ink-2:#B9C5D3; --muted:#8798AC;
  --brand:#0A1724; --brand-2:#13263A; --brand-ink:#F5ECDB; --brand-mute:#8FA3B9;
  --gold:#D2AA4A; --gold-ink:#E2BE68; --gold-wash:#2A2415; --gold-line:#5C4A1E;
  --link:#7DB0F0;
  --ok:#5BD07A; --ok-dot:#0ca30c; --ok-wash:#11301E;
  --warn:#F2C35A; --warn-dot:#fab219; --warn-wash:#33280F;
  --bad:#F08A80; --bad-dot:#d03b3b; --bad-wash:#3A1716;
  --s1:#3987e5; --s2:#b8891f;
  --heat0:#18293B; --heat1:#163a5f; --heat2:#1c5cab; --heat3:#3987e5; --heat4:#9ec5f4;
  --grid:#1D3045; --axis:#2E4660;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
*{box-sizing:border-box}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:13px}
.xs{font-size:12px}
.up{text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;font-weight:700}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{display:none}
.mainwrap{min-width:0;display:flex;flex-direction:column;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:54px}
.top .tb-brand{display:flex;flex-direction:column;line-height:1.1;min-width:0;flex:1}
.top .tb-brand b{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:800}
.top .tb-brand span{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tb-actions{display:flex;align-items:center;gap:6px}
.tb-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(245,236,219,.08);border:1px solid rgba(245,236,219,.16);color:var(--brand-ink);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;min-height:34px}
.tb-btn:hover{background:rgba(245,236,219,.16)}
.tb-btn.run{background:var(--gold);color:#0D1B2A;border-color:var(--gold)}
.tb-btn svg{width:16px;height:16px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--brand-mute)}
@media (max-width:979px){.top .sync .tx{display:none}.top .tb-timer:not(.run) span{display:none}.top .tb-timer{padding:6px 9px}}
.sync i{width:8px;height:8px;border-radius:50%;background:#7c8a99;display:inline-block}
.sync.cloud i{background:var(--ok-dot)}
.sync.saving i{background:var(--warn-dot)}
.sync.err i{background:var(--bad-dot)}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:18px 16px 110px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:10px;text-decoration:none}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--ink)}
.tabbar a.on svg{color:var(--gold)}
@media (min-width:980px){
  .app{grid-template-columns:236px 1fr}
  .rail{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--brand);color:var(--brand-ink);padding:18px 12px;gap:4px;overflow-y:auto}
  .tabbar{display:none}
  .top{background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
  .top .tb-brand b{display:none}
  .top .tb-brand span{font-size:18px}
  .top .tb-menu{display:none}
  .top .tb-btn{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .top .tb-btn.run{background:var(--gold);color:#0D1B2A;border-color:var(--gold)}
  .top .sync{color:var(--muted)}
  main{padding:22px 28px 48px}
}
.rail .brand{padding:6px 10px 14px;border-bottom:1px solid rgba(245,236,219,.12);margin-bottom:8px}
.rail .brand b{display:block;font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:800}
.rail .brand strong{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.rail .brand span{display:block;font-size:12.5px;color:var(--brand-mute)}
.rail .cd{margin:4px 10px 12px;padding:10px 12px;border-radius:10px;background:var(--brand-2);display:flex;align-items:baseline;gap:8px}
.rail .cd strong{font-size:26px;font-weight:800;color:var(--gold);line-height:1}
.rail .cd span{font-size:12px;color:var(--brand-mute);line-height:1.3}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--brand-ink);font-size:14px;font-weight:500;text-decoration:none;opacity:.86}
.rail nav a svg{width:18px;height:18px;flex:none;color:var(--brand-mute)}
.rail nav a:hover{background:rgba(245,236,219,.07);opacity:1}
.rail nav a.on{background:rgba(196,155,54,.16);opacity:1;font-weight:700}
.rail nav a.on svg{color:var(--gold)}
.rail nav .sep{height:1px;background:rgba(245,236,219,.1);margin:8px 6px}
.rail nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-mute);padding:8px 10px 2px;font-weight:700}
.rail .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid rgba(245,236,219,.12);display:flex;flex-direction:column;gap:6px}

/* ---------- generic UI ---------- */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh h1{font-size:26px;font-weight:800;letter-spacing:-.015em}
.vh p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flush{padding:0}
.card h2{font-size:16px;font-weight:800;letter-spacing:-.005em}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card .ch .sub{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer;min-height:38px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
:root[data-theme="dark"] .btn.pri{background:var(--gold);border-color:var(--gold);color:#0D1B2A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--gold);border-color:var(--gold);color:#0D1B2A}}
.btn.pri:hover{filter:brightness(1.12)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0D1B2A}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.xs{min-height:28px;padding:3px 8px;font-size:12.5px;border-radius:7px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.done{background:var(--ok-wash);border-color:transparent;color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;min-height:32px;white-space:nowrap}
.chips .chip{max-width:100%;white-space:normal;text-align:left;line-height:1.3}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
:root[data-theme="dark"] .chip.on{background:var(--gold);border-color:var(--gold);color:#0D1B2A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--gold);border-color:var(--gold);color:#0D1B2A}}
.code{display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.02em;border-radius:6px;padding:2px 7px;background:var(--surface-3);color:var(--ink);min-width:44px;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;letter-spacing:.02em;white-space:nowrap}
.tag.alta{background:var(--bad-wash);color:var(--bad)}
.tag.media{background:var(--warn-wash);color:var(--warn)}
.tag.baixa{background:var(--surface-3);color:var(--ink-2)}
.tag.p{background:var(--surface-3);color:var(--ink-2)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.st i{width:9px;height:9px;border-radius:50%;background:var(--line-2);display:inline-block;flex:none}
.st.ok i{background:var(--ok-dot)} .st.warn i{background:var(--warn-dot)} .st.bad i{background:var(--bad-dot)}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--gold)}
.bar.navy>i{background:var(--s1)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:18px;color:var(--ink-2);background:var(--surface-2);font-size:14px}
.empty b{color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));align-items:end}
.form .wide{grid-column:1/-1}
.form>.btn{justify-self:start;max-width:100%}
.form .span2{grid-column:span 2}
@media (max-width:520px){.form .span2{grid-column:1/-1}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.hr{height:1px;background:var(--line);margin:14px 0}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.sheetbg{position:fixed;inset:0;background:rgba(8,18,28,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:18px;padding:20px}}
.sheet h2{font-size:18px;font-weight:800}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.menu-grid a{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;background:var(--surface-2)}
.menu-grid a svg{width:20px;height:20px;color:var(--gold-ink)}
.menu-grid a span{font-weight:500;font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
#toast div{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
@media (min-width:980px){#toast{bottom:24px}}

/* ---------- Hoje ---------- */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:18px;display:grid;gap:14px;grid-template-columns:1fr;position:relative;overflow:hidden}
.hero .cdn{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .cdn strong{font-size:52px;line-height:.95;font-weight:800;letter-spacing:-.03em;color:var(--gold)}
.hero .cdn span{font-size:15px;color:var(--brand-ink);opacity:.9}
.hero .meta{font-size:14px;color:var(--brand-mute)}
.hero .meta b{color:var(--brand-ink)}
.hero .tl{display:flex;gap:3px;margin-top:2px}
.hero .tl i{flex:1;height:8px;border-radius:3px;background:rgba(245,236,219,.14)}
.hero .tl i.past{background:rgba(196,155,54,.55)}
.hero .tl i.cur{background:var(--gold)}
.hero .tl-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--brand-mute);margin-top:4px}
.hero .hk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hero .hk div{background:var(--brand-2);border-radius:10px;padding:10px 12px}
.hero .hk b{display:block;font-size:22px;font-weight:800;color:var(--brand-ink)}
.hero .hk span{font-size:12px;color:var(--brand-mute)}
@media (min-width:760px){.hero{grid-template-columns:1.3fr 1fr;align-items:center;padding:22px 24px}}
.it{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:12px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0;padding-top:2px}
.it .ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface);color:transparent;flex:none;margin-top:2px}
.it .ck:hover{border-color:var(--ok)}
.it .ck.on{background:var(--ok-dot);border-color:var(--ok-dot);color:#fff}
.it .ck svg{width:16px;height:16px}
.it .t{min-width:0}
.it .t .l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.it .t .l1 b{font-size:14.5px}
.it .t .l2{font-size:14px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .t .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.it.done .t .l2{text-decoration:line-through;text-decoration-color:var(--line-2)}
.it .steps{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.it .steps li{margin:3px 0}
.dues{display:flex;flex-direction:column}
.due{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.due:first-child{border-top:0;padding-top:0}
.rk{font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 6px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.rk.late{background:var(--bad-wash);color:var(--bad)}
.rk.today{background:var(--gold-wash);color:var(--gold-ink)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.kpi .v small{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:0}
.kpi .d{font-size:12.5px;color:var(--ink-2);margin-top:4px}

/* ---------- Plano ---------- */

.day{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}

.day .dd{display:flex;flex-direction:column;align-items:flex-start}

.day .dd span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.day .dd em{font-style:normal;font-size:11px;color:var(--muted)}
.day .its{display:flex;flex-direction:column;gap:6px;min-width:0}
.dl{display:flex;align-items:flex-start;gap:8px;min-width:0;font-size:14px}
.dl .sd{width:18px;height:18px;border-radius:5px;border:2px solid var(--line-2);flex:none;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;color:transparent}
.dl .sd.on{background:var(--ok-dot);border-color:var(--ok-dot);color:#fff}
.dl .sd.late{border-color:var(--bad-dot)}
.dl .sd svg{width:12px;height:12px}
.dl a{color:var(--ink);min-width:0}
.dl .tt{min-width:0;flex:1}
.dl .tt span{color:var(--ink-2)}
.dl.cr .tt{color:var(--ink-2)}
.dl .tt b{font-weight:700}
.dl button.lnk{border:0;background:none;padding:0;color:var(--ink-2);cursor:pointer;text-align:left;font-size:14px}
.dl button.lnk:hover{color:var(--ink);text-decoration:underline}
.cardx{margin:2px 0 6px 26px;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:14px;color:var(--ink-2)}
.cardx ol{margin:6px 0 0;padding-left:18px}
.cardx .f b{color:var(--ink);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.mt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mt:first-of-type{border-top:0}
.mt .tt{min-width:0}
.mt .tt a{color:var(--ink);font-weight:600}
.mt .tt div{font-size:13px;color:var(--muted);margin-top:2px}
.rv{display:inline-flex;gap:3px}
.rv i{width:16px;height:16px;border-radius:4px;background:var(--surface-3);font-style:normal;font-size:9.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.rv i.on{background:var(--ok-dot);color:#fff}
.rv i.due{background:var(--gold);color:#0D1B2A}
.rv i.late{background:var(--bad-dot);color:#fff}

/* ---------- Meta ---------- */
.mh{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.mh h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.mh .top-l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.links{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.lk{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
.lk:hover{border-color:var(--ink-2);text-decoration:none}
.lk .ic{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.lk .ic svg{width:22px;height:22px}
.lk .ic.yt{background:#FCEBEA;color:#B42318}
.lk .ic.tec{background:#E6EFFA;color:#1F5FAD}
.lk .ic.doc{background:var(--gold-wash);color:var(--gold-ink)}
.lk .ic.law{background:var(--surface-3);color:var(--ink)}
:root[data-theme="dark"] .lk .ic.yt{background:#3A1716;color:#F08A80}
:root[data-theme="dark"] .lk .ic.tec{background:#14304F;color:#7DB0F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lk .ic.yt{background:#3A1716;color:#F08A80}:root:not([data-theme="light"]) .lk .ic.tec{background:#14304F;color:#7DB0F0}}
.lk .tx{min-width:0;flex:1}
.lk .tx b{display:block;font-size:14.5px;line-height:1.3}
.lk .tx span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden}
.lk .ext{width:16px;height:16px;color:var(--muted);flex:none}
.note{border-radius:12px;padding:13px 15px;font-size:14.5px;line-height:1.55}
.note b.t{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.note.navy{background:var(--surface-2);border:1px solid var(--line)}
.note.navy b.t{color:var(--ink-2)}
.note.gold{background:var(--gold-wash);border:1px solid var(--gold-line)}
.note.gold b.t{color:var(--gold-ink)}
.note.red{background:var(--bad-wash);border:1px solid transparent}
.note.red b.t{color:var(--bad)}
.note.green{background:var(--ok-wash);border:1px solid transparent}
.note.green b.t{color:var(--ok)}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.rev{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rev.done{background:var(--ok-wash);border-color:transparent}
.rev.late{border-color:var(--bad-dot)}
.rev b{font-size:14px}
.rev span{font-size:13px;color:var(--ink-2)}
.loglist{display:flex;flex-direction:column}
.logr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.logr:first-child{border-top:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ---------- Questões ---------- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:760px;margin:0 auto}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.qprog{height:4px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-bottom:16px}
.qprog i{display:block;height:100%;background:var(--gold)}
.qtext{font-family:var(--f-read);font-size:calc(18px*var(--fz,1));line-height:1.6;color:var(--ink)}
.qbase{font-family:var(--f-read);font-size:15.5px;line-height:1.65;background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-bottom:14px;color:var(--ink-2)}
.qbase summary{font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--ink)}
.qbtns{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:18px}
.qbtns .btn{min-height:50px;font-size:16px}
.qbtns .c{border-color:var(--ok);color:var(--ok)}
.qbtns .e{border-color:var(--bad);color:var(--bad)}
.qbtns .c.sel{background:var(--ok-dot);color:#fff;border-color:var(--ok-dot)}
.qbtns .e.sel{background:var(--bad-dot);color:#fff;border-color:var(--bad-dot)}
.qbtns .b.sel{background:var(--surface-3)}
.qbtns .btn.sel[disabled]{opacity:1}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:calc(15px*var(--fz,1));line-height:1.55}
.fb.ok{background:var(--ok-wash)}
.fb.bad{background:var(--bad-wash)}
.fb.blank{background:var(--surface-2)}
.fb b.h{display:block;font-size:15px;margin-bottom:4px}
.fb.ok b.h{color:var(--ok)} .fb.bad b.h{color:var(--bad)}
.ai{margin-top:12px;border-left:3px solid var(--gold);padding:8px 0 8px 12px;font-size:14.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap}
.ai .lbl{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:4px;white-space:normal}
.qnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:16px}.qnav>:first-child{justify-self:start}.qnav>:last-child{justify-self:end}@media (max-width:460px){.qnav .qn-w{display:none}}@media (max-width:360px){.qnav .qn-l{display:none}}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-radius:4px;padding:0 4px;color:var(--muted)}
.res-big{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.res-big strong{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.qlist{display:flex;flex-direction:column}
.qli{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.qli .mk{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.qli .mk.ok{background:var(--ok-wash);color:var(--ok)}
.qli .mk.bad{background:var(--bad-wash);color:var(--bad)}
.qli .mk.blank{background:var(--surface-3);color:var(--muted)}
.dtab{width:100%;border-collapse:collapse;font-size:14px}
.dtab th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dtab td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.dtab td.n,.dtab th.n{text-align:right;font-variant-numeric:tabular-nums}
.dtab tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* discursiva */
.paper{font-family:var(--f-read);font-size:16.5px;line-height:1.75;min-height:420px;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.75em - 1px),var(--line) calc(1.75em - 1px),var(--line) 1.75em);background-attachment:local;padding:6px 12px}
.cnt{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.cnt b{color:var(--ink)}
.asp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.asp:first-child{border-top:0}
.tri{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:2px}
.tri button{border:0;background:transparent;padding:5px 9px;font-size:12.5px;font-weight:700;border-radius:7px;color:var(--ink-2);cursor:pointer}
.tri button.on0{background:var(--bad-dot);color:#fff}
.tri button.on1{background:var(--warn-dot);color:#0D1B2A}
.tri button.on2{background:var(--ok-dot);color:#fff}
.timer{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}

/* ---------- charts ---------- */
.chart{width:100%;min-width:0;min-height:60px}
.chart svg{display:block;max-width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-ui);fill:var(--muted);font-size:11px}
.chart .lab{fill:var(--ink-2);font-size:12px}
.chart .val{fill:var(--ink);font-size:11.5px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.l{height:2px;width:14px;border-radius:2px}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.4;box-shadow:var(--shadow);max-width:260px}
#tip b{font-size:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;width:max-content}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--heat0);display:block}
.heat i.h1{background:var(--heat1)} .heat i.h2{background:var(--heat2)} .heat i.h3{background:var(--heat3)} .heat i.h4{background:var(--heat4)}
.heat i.out{background:transparent}
.heat i.td{outline:2px solid var(--gold);outline-offset:1px}
.heatwrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.heatwrap .wd{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:10px;color:var(--muted)}
.hscale{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:8px}
.hscale i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cons{display:grid;gap:18px}
@media (min-width:760px){.cons{grid-template-columns:max-content minmax(0,1fr);gap:36px;align-items:start}}
.cstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0;align-content:start}
.cstats>div{border-left:3px solid var(--line);padding:1px 0 1px 10px;min-width:0}
.cstats dt{font-size:12px;color:var(--muted)}
.cstats dd{margin:2px 0 0;font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cstats dd small{font-size:12px;font-weight:500;color:var(--muted)}

/* ---------- reader ---------- */
.reader{max-width:760px}
.rd-tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:10;background:var(--bg);padding:8px 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (min-width:980px){.rd-tools{top:calc(env(safe-area-inset-top,0px) + 58px)}}
.rd-tools input[type=search]{flex:1;min-width:160px}
@media (max-width:699px){.rd-tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:8px 16px 10px}.rd-tools::-webkit-scrollbar{display:none}.rd-tools>*{flex:0 0 auto}.rd-tools input[type=search]{flex:0 0 64%;min-width:0}}
.doc{font-family:var(--f-read);font-size:calc(16.5px*var(--fz,1));line-height:1.7;color:var(--ink);overflow-wrap:break-word}
.doc h2,.doc h3,.doc h4{font-family:var(--f-ui)}
.doc .d-h1{font-size:calc(22px*var(--fz,1));font-weight:800;margin:28px 0 10px;padding-top:6px;border-top:2px solid var(--gold)}
.doc .d-h2{font-size:calc(18.5px*var(--fz,1));font-weight:800;margin:24px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.doc .d-h3{font-size:calc(15.5px*var(--fz,1));font-weight:800;margin:18px 0 6px;color:var(--gold-ink)}
.doc p{margin:8px 0}
.doc ul,.doc ol{margin:8px 0;padding-left:22px}
.doc li{margin:4px 0}
.doc .note{font-family:var(--f-ui);font-size:calc(14.5px*var(--fz,1));margin:12px 0}
.doc .note ul{margin:4px 0;padding-left:18px}
.doc figure{margin:14px 0;background:#fff;border-radius:12px;padding:10px;border:1px solid var(--line)}
.doc figure img{display:block;width:100%;height:auto;border-radius:6px}
.doc figcaption{font-family:var(--f-ui);font-size:calc(12.5px*var(--fz,1));color:#5B6575;margin-top:6px}
.doc .tw{margin:12px 0;border:1px solid var(--line);border-radius:10px}
.doc table{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:calc(13.5px*var(--fz,1));line-height:1.45}
.doc th{background:var(--brand);color:var(--brand-ink);text-align:left;padding:8px 10px;font-weight:700;vertical-align:top}
.doc td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.doc tr:nth-child(even) td{background:var(--surface-2)}
.doc mark{background:var(--gold-wash);color:var(--ink);border-bottom:2px solid var(--gold);padding:0 1px}
.doc .tagx{display:inline-block;font-family:var(--f-ui);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-3);border-radius:6px;padding:2px 8px;margin:6px 0}
.lido{font-family:var(--f-ui);font-size:12px;font-weight:700;border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;background:var(--surface);cursor:pointer;color:var(--muted);white-space:nowrap}
.lido.on{background:var(--ok-wash);border-color:transparent;color:var(--ok)}
.toc a{display:block;padding:7px 4px;color:var(--ink);border-top:1px solid var(--line);font-size:14px}
.toc a.h3{padding-left:20px;color:var(--ink-2);font-size:13.5px}
.toc a.h1{font-weight:800}
.law{font-family:var(--f-read);font-size:calc(16px*var(--fz,1));line-height:1.65}
.law .lt1{font-family:var(--f-ui);font-size:calc(13px*var(--fz,1));font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:22px 0 2px;text-align:center}
.law .lt2{font-family:var(--f-ui);font-size:calc(14px*var(--fz,1));font-weight:700;color:var(--gold-ink);margin:0 0 8px;text-align:center}
.law .a{margin:3px 0;padding:3px 8px;border-radius:8px;position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

.law .a .fl{opacity:.35;border:0;background:none;cursor:pointer;color:var(--muted);padding:2px;align-self:start}
.law .a:hover .fl,.law .a .fl.on,.law .a .fl:focus-visible{opacity:1}
.law .a .fl.on{color:var(--bad)}
.law .a .fl svg{width:16px;height:16px}
@media (hover:none){.law .a .fl{opacity:.6}}
.lawcard{display:flex;flex-direction:column;gap:8px}
.lawcard b{font-size:15px}

/* timer */
.bigtime{font-family:var(--f-mono);font-size:56px;font-weight:600;letter-spacing:-.02em;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.report{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.report h2{font-size:17px;font-weight:800;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.report h2:first-of-type{margin-top:8px}
.report ul{padding-left:18px;margin:6px 0}
.report li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}

.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.refs .btn{background:var(--surface)}
@keyframes flashA{0%,45%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 3px transparent}}

@media screen and (max-width:699px){.doc .tw table.wide{min-width:560px}.dtab td:first-child,.dtab th:first-child{min-width:138px}}


/* ---------- Protocolo Escrevente: adições ---------- */
.tb-back{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid rgba(245,236,219,.16);background:rgba(245,236,219,.08);color:var(--brand-ink);cursor:pointer;flex:none}

.tt-msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.tt-msg.me{align-self:flex-end;background:var(--brand-2);color:var(--brand-ink);border-bottom-right-radius:4px}
.tt-msg.ai{align-self:flex-start;background:var(--gold-wash);color:var(--ink-2);border-left:3px solid var(--gold);border-bottom-left-radius:4px}
.tt-msg.ai .lbl{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:4px;white-space:normal}
.tt-sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tt-sug .btn{white-space:normal;text-align:left;height:auto}
.tt-in{display:flex;gap:10px;align-items:flex-end}
.tt-in textarea{flex:1;min-width:0;resize:vertical}
@media (max-width:600px){.tt-in{flex-direction:column;align-items:stretch}.tt-msg{max-width:100%}}
/* login */
.lg-sheet{max-width:440px}
.lg-google{width:100%;justify-content:center;min-height:46px;font-weight:700;background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.lg-or{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--muted);font-size:12.5px}
.lg-or::before,.lg-or::after{content:"";flex:1;height:1px;background:var(--line)}
.lg-code{font-family:var(--f-mono);font-size:22px;letter-spacing:.3em;text-align:center}
.lnk{background:none;border:0;padding:0;color:var(--link);font:inherit;cursor:pointer;text-decoration:underline}
.lnk:disabled{color:var(--muted);cursor:default;text-decoration:none}
/* minha conta */
.tag.ok{background:var(--ok-wash);color:var(--ok)}
.tag.warn{background:var(--warn-wash);color:var(--warn)}
.tag.bad{background:var(--bad-wash);color:var(--bad)}
.acct-head{display:flex;align-items:center;gap:14px}
.acct-head>div:last-child{display:flex;flex-direction:column;min-width:0}
.acct-head span{overflow-wrap:anywhere}
.acct-av{width:56px;height:56px;border-radius:50%;background:var(--brand-2);color:var(--gold);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.acct-nm{font-size:18px}
.acct-plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acct-plan{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.acct-plan.cur{border-color:var(--gold);background:var(--gold-wash)}
.acct-plan .pp{font-size:20px;font-weight:800;color:var(--ink)}
.acct-plan .btn,.acct-plan .tag{margin-top:6px}
.conta-aviso{border-left:4px solid var(--warn)}
label.f.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.kpis.acct-k{grid-template-columns:repeat(3,minmax(0,1fr))}

/* tutorial do app */
.tut-card{display:flex;align-items:center;gap:14px;border-left:4px solid var(--gold)}
.tut-card .tut-ic{width:42px;height:42px;border-radius:12px;background:#0D1B2A;color:#C49B36;display:grid;place-items:center;flex:none}
.tut-card .tut-ic svg{width:24px;height:24px}
.tut-card .tut-tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tut-player{padding:0;overflow:hidden}
.tut-frame{position:relative;aspect-ratio:16/9;background:#0D1B2A}
.tut-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tut-caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.tut-caps button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font:inherit;font-weight:600;cursor:pointer}
.tut-caps button .mono{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);min-width:36px}
.tut-caps button:hover,.tut-caps button.on{border-color:var(--gold);background:var(--gold-wash)}
@media (max-width:600px){.tut-card{flex-wrap:wrap}.tut-caps{grid-template-columns:1fr 1fr}}

.jord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.jord-it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:grab;touch-action:none;user-select:none}
.jord-it.arr{position:relative;z-index:5;box-shadow:var(--shadow);border-color:var(--gold);cursor:grabbing}
.jord-it.alvo-a{box-shadow:0 -3px 0 var(--gold)}
.jord-it.alvo-d{box-shadow:0 3px 0 var(--gold)}
.jord-it.ok{background:var(--ok-wash);border-color:transparent}
.jord-it.bad{background:var(--bad-wash);border-color:transparent}
.jord-n{width:26px;height:26px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.jord-t{font-size:15px;line-height:1.35}
.jord-b{display:flex;gap:2px}
.jpar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jpar-c{display:flex;flex-direction:column;gap:8px}
.jpa,.jpb{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:13.5px;line-height:1.35;text-align:left;cursor:pointer;min-height:64px;overflow-wrap:anywhere}
.jpa{touch-action:none}
.jpa.sel{border-color:var(--gold);background:var(--gold-wash)}
.jpa.feito,.jpb.feito{background:var(--ok-wash);border-color:transparent;color:var(--ok);cursor:default}
.jfim{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 16px}
.jfim-ic{width:58px;height:58px;border-radius:50%;background:var(--gold-wash);color:var(--gold-ink);display:flex;align-items:center;justify-content:center}
.jfim-ic svg{width:28px;height:28px}
.jfim .kpis{width:100%;max-width:420px}
.jerr{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.jerr:first-of-type{border-top:0;padding-top:0}
.jcode{font-family:var(--f-mono,monospace);letter-spacing:.06em;color:var(--ink)}
/* Questões inéditas por tópico do edital */
.ined{padding:0;overflow:hidden}
.ined-h{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ined-h>span{display:flex;flex-direction:column;gap:3px;min-width:0}
.ined-h b{font-size:16px}
.ined-h svg{width:20px;height:20px;flex:none;color:var(--muted);transition:transform .15s}
.ined.open .ined-h svg{transform:rotate(90deg)}
.ined-b{padding:0 16px 14px}
.itop{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.it-t{min-width:0;flex:1}
.it-t>b{display:block;font-size:14px;line-height:1.35}
.it-a{flex:none}
@media (max-width:560px){.itop{flex-direction:column;align-items:stretch}.it-a .btn{width:100%;justify-content:center}}
/* tour guiado do primeiro acesso */
.tour{position:fixed;inset:0;z-index:90}
.tour.c{background:rgba(8,18,28,.66)}
.tour-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,18,28,.66),0 0 0 3px #C49B36,0 0 22px 6px rgba(196,155,54,.45);transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease;pointer-events:none}
.tour-card{position:fixed;width:min(340px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;box-shadow:0 14px 44px rgba(0,0,0,.38);border-top:4px solid var(--gold);transition:left .25s ease,top .25s ease}
.tour.c .tour-card{left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));text-align:center;padding:22px 20px 18px}
.tour-top{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 8px}
.tour-n{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.tour-skip{font:inherit;font-size:12.5px;color:var(--muted);text-decoration:underline;background:none;border:0;cursor:pointer;padding:6px 2px}
.tour-skip:hover{color:var(--ink)}
.tour-h{display:flex;align-items:center;gap:10px}
.tour-ic{width:36px;height:36px;border-radius:10px;background:#0D1B2A;color:#C49B36;display:grid;place-items:center;flex:none}
.tour-ic svg{width:20px;height:20px}
.tour-card h3{font-size:16.5px;font-weight:800;line-height:1.3;margin:0}
.tour-card p{font-size:14px;line-height:1.55;color:var(--ink-2);margin:10px 0 0}
.tour-onde{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--gold-ink);font-weight:700;margin-top:10px}
.tour-onde svg{width:15px;height:15px}
.tour-dots{display:flex;gap:3px;margin-top:14px}
.tour-dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.tour-dots i.on{background:var(--gold)}
.tour-bt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.tour-bt.c{flex-direction:column;align-items:stretch;margin-top:18px}
.tour-bt.c .btn{justify-content:center}
.tour-bt svg{width:16px;height:16px}
.tour-hero{width:56px;height:56px;border-radius:16px;background:#0D1B2A;color:#C49B36;display:grid;place-items:center;margin:0 auto 12px}
.tour-hero svg{width:30px;height:30px}
.tour-hero.ok{background:var(--gold);color:#0D1B2A}
.tour-nota{font-size:12px!important;color:var(--muted)!important;margin-top:12px!important}
.start-bar button.sb-b{background:none;font:inherit;font-size:12.5px;font-weight:700;color:#E4E9F0;cursor:pointer}
/* aviso: Oficial de Justiça liberado */
.oj-lib{display:flex;align-items:center;gap:14px;border-left:4px solid var(--gold);background:var(--gold-wash);margin-bottom:12px}
.oj-lib-ic{width:42px;height:42px;border-radius:12px;background:#0D1B2A;color:#C49B36;display:grid;place-items:center;flex:none}
.oj-lib-ic svg{width:24px;height:24px}
.oj-lib-tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.oj-lib-tx b{font-size:15px}
.oj-lib-tx span{font-size:13px;color:var(--ink-2);line-height:1.45}
.oj-lib-bt{display:flex;gap:6px;align-items:center}
@media (max-width:600px){.oj-lib{flex-wrap:wrap}.oj-lib-bt{width:100%}.oj-lib-bt .btn.gold{flex:1;justify-content:center}}
/* plano combinado 2.0 */
.cb-tabs{margin:0 0 14px;flex-wrap:wrap}
.cb-foco{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cb-foco .seg{flex-wrap:wrap}
.cb-eco{display:flex;align-items:center;gap:10px;background:var(--ok-wash);color:var(--ink);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.cb-eco svg{width:20px;height:20px;color:var(--ok);flex:none}
.cb-lista{display:flex;flex-direction:column;gap:8px}
.cb-it{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cb-it .cb-flag{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.cb-it .cb-flag svg{width:14px;height:14px}
.cb-it .btn{align-self:center}
.cb-tt{min-width:0}
.cb-tt>a,.cb-par a,.cb-rl{display:flex;align-items:baseline;gap:6px;color:var(--ink);text-decoration:none;font-weight:600;line-height:1.35}
.cb-tt>a:hover,.cb-par a:hover,.cb-rl:hover{text-decoration:underline}
.cb-code{margin-right:2px;flex:none}
.cb-tt .ctag,.cb-par .ctag,.cb-rl .ctag,.cb-mp .ctag{flex:none}
.cb-par{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding-left:10px;border-left:2px solid var(--ok)}
.cb-par a{font-weight:500;font-size:13.5px}
.cb-dupla{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:linear-gradient(0deg,var(--surface),var(--surface)),var(--ok-wash);box-shadow:inset 4px 0 0 var(--ok)}
.cb-dupla .cb-flag{color:var(--ok)}
.cb-ja{box-shadow:inset 4px 0 0 #2F7FD3}
.cb-ja .cb-flag{color:#2F7FD3}
.cb-ponte{box-shadow:inset 4px 0 0 var(--gold)}
.cb-ponte .cb-flag{color:var(--gold-ink)}
.cb-rdupla{background:var(--ok-wash);border-radius:10px}
.cb-rflag{color:var(--ok);font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.cb-rl{font-size:13.5px;margin:2px 0}
.cb-leg{margin-top:14px}
.cb-legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.cb-legs>div{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;font-size:13px}
.cb-legs>div span:last-child{grid-column:2;color:var(--ink-2);font-size:12.5px;line-height:1.4}
.cb-dot{width:12px;height:12px;border-radius:4px;display:inline-block}
.cb-dot.ig{background:var(--ok)}.cb-dot.ja{background:#2F7FD3}.cb-dot.pa{background:var(--gold)}
.cb-hero{display:flex;gap:20px 28px;align-items:center;flex-wrap:wrap;background:radial-gradient(ellipse at 15% 0%,#1d3550 0%,#0D1B2A 70%);color:#E9EEF4;border:0;margin-bottom:14px}
.cb-hero-tx{flex:1 1 320px;min-width:0}
.cb-k{color:var(--gold);font-weight:800;font-size:11.5px;letter-spacing:.18em}
.cb-hero h2{font-size:24px;font-weight:800;color:#fff;margin:6px 0 8px;line-height:1.25}
.cb-hero p{color:#B9C4D2;font-size:14.5px;line-height:1.55;max-width:62ch}
.cb-aneis{display:flex;gap:18px;flex-wrap:wrap}
.cb-an{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;text-align:center;font-size:12.5px;color:#B9C4D2;line-height:1.35}
.cb-an b{color:#fff}
.cb-anel{width:92px;height:92px;color:#fff}
.cb-col{display:flex;flex-direction:column;gap:8px}
.cb-ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cb-b3{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-3)}
.cb-b3 i{display:block;height:100%}
.cb-b3 i.ig,.cb-legs3 i.ig{background:var(--ok)}.cb-b3 i.pa,.cb-legs3 i.pa{background:var(--gold)}.cb-b3 i.no,.cb-legs3 i.no{background:var(--line-2)}
.cb-nums{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.cb-nums b{color:var(--ink);font-size:15px}
.cb-legs3{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.cb-legs3 span{display:inline-flex;align-items:center;gap:6px}
.cb-legs3 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.cb-tab-wrap{overflow-x:auto;padding:8px 16px 14px}
.cb-tab{width:100%;border-collapse:collapse;font-size:13.5px}
.cb-tab th,.cb-tab td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.cb-tab thead th{font-size:12px;color:var(--muted);font-weight:700}
.cb-tab tbody th{font-weight:700;white-space:nowrap}
.cb-tab td{width:38%}
.cb-dc{display:flex;flex-direction:column;gap:4px;min-width:120px}
.cb-dc .cb-b3{height:9px}
.cb-muda h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cb-muda h2 svg{width:18px;height:18px;color:var(--gold-ink)}
.cb-muda ul,.cb-regras{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.cb-muda b,.cb-regras b{color:var(--ink)}
.cb-mapa{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto;padding-right:4px}
.cb-mp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 3px 0 0 var(--line-2)}
.cb-mp.igual{box-shadow:inset 3px 0 0 var(--ok)}.cb-mp.parcial{box-shadow:inset 3px 0 0 var(--gold)}
.cb-mp-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cb-mp-h a{display:flex;gap:6px;align-items:baseline;color:var(--ink);text-decoration:none;font-weight:600;font-size:13.5px;line-height:1.35}
.cb-pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.cb-pill.igual{background:var(--ok-wash);color:var(--ok)}.cb-pill.parcial{background:var(--gold-wash);color:var(--gold-ink)}.cb-pill.novo{background:var(--surface-3);color:var(--ink-2)}
.ok-t{color:var(--ok);font-weight:700}
.cb-passos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.cb-passo{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);position:relative}
.cb-passo:last-child{border-bottom:0}
.cb-pn{width:36px;height:36px;border-radius:50%;background:#0D1B2A;color:#C49B36;display:grid;place-items:center;font-weight:800;font-size:16px}
.cb-passo b{font-size:15.5px}
.cb-passo p{margin:4px 0 0;color:var(--ink-2);font-size:14px;line-height:1.55}
.cb-dia{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.cb-dia b{color:var(--ink)}
.cb-chip{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.45;padding:8px 12px;border-radius:10px;margin:8px 0 10px;max-width:75ch}
.cb-chip svg{width:16px;height:16px;flex:none;margin-top:1px}
.cb-chip.igual{background:var(--ok-wash);color:var(--ink)}.cb-chip.igual svg{color:var(--ok)}
.cb-chip.parcial{background:var(--gold-wash);color:var(--ink)}.cb-chip.parcial svg{color:var(--gold-ink)}
.cb-chip.novo{background:var(--surface-3);color:var(--ink-2)}
@media (max-width:600px){.cb-it{grid-template-columns:1fr}.cb-it .btn{justify-self:start}.cb-hero h2{font-size:20px}.cb-an{width:130px}.cb-tab td{width:auto}}
/* banner de divulgação do Oficial de Justiça (Início do Escrevente) */
.oj-promo{position:relative;display:grid;grid-template-columns:1fr 200px;gap:10px 24px;align-items:center;overflow:hidden;border-radius:16px;padding:22px 24px 0 26px;margin-bottom:12px;cursor:pointer;color:#F5F0E8;background:radial-gradient(520px 320px at 85% 10%,rgba(110,31,46,.95),transparent 70%),radial-gradient(420px 300px at 0% 100%,rgba(87,24,37,.8),transparent 70%),linear-gradient(160deg,#170A0D,#0B0506);border:1px solid rgba(238,180,80,.35);box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.oj-promo:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(87,24,37,.35)}
.oj-promo:focus-visible{outline:3px solid #EEB450;outline-offset:2px}
.ojp-tx{padding-bottom:22px;min-width:0}
.ojp-k{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:#EEB450}
.oj-promo h2{font-size:24px;line-height:1.2;font-weight:800;margin:8px 0 8px;color:#F5F0E8}
.oj-promo h2 span{color:#EEB450}
.oj-promo p{font-size:14px;line-height:1.5;color:#D9BFB2;max-width:60ch}
.ojp-cta{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:10px 18px;border-radius:999px;background:linear-gradient(90deg,#F6C878,#EEB450 55%,#C98F2E);color:#0B0506;font-weight:800;font-size:14px}
.ojp-cta svg{width:16px;height:16px}
.ojp-img{align-self:end;height:100%;display:flex;align-items:flex-end;justify-content:center}
.ojp-img img{display:block;width:180px;height:auto;border-radius:22px 22px 0 0;border:6px solid #241316;border-bottom:0;box-shadow:0 -6px 30px rgba(0,0,0,.45);transform:translateY(8px)}
.ojp-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#F5F0E8;display:grid;place-items:center;cursor:pointer}
.ojp-x svg{width:15px;height:15px}
@media (max-width:640px){.oj-promo{grid-template-columns:1fr 112px;padding:18px 16px 0 18px;gap:8px 12px}.oj-promo h2{font-size:19px}.oj-promo p{font-size:13px}.ojp-img img{width:112px;border-width:4px;border-radius:16px 16px 0 0}.ojp-cta{font-size:13px;padding:9px 14px}}
.camp-prev{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);max-width:460px}
.camp-prev .cp-ic img{width:38px;height:38px;border-radius:9px;display:block}
.camp-prev b{display:block;font-size:14px}
.camp-prev span{display:block;font-size:13px;color:var(--ink-2);line-height:1.4;margin-top:2px}
/* acerto por meta (Desempenho) */
.pm-list{display:flex;flex-direction:column;gap:2px}
.pm-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 128px 240px;gap:6px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pm-row:last-child{border-bottom:0}
.pm-meta{display:flex;gap:10px;align-items:flex-start;color:var(--ink);text-decoration:none;min-width:0}
.pm-meta:hover .pm-tt span{text-decoration:underline}
.pm-tt{display:flex;flex-direction:column;min-width:0;font-size:13.5px;line-height:1.35}
.pm-tt span{color:var(--ink-2);font-size:12.5px}
.pm-bar{display:flex;flex-direction:column;gap:4px;min-width:0}
.pm-bar .bar.ok i{background:var(--ok-dot)}.pm-bar .bar.warn i{background:var(--warn-dot)}.pm-bar .bar.bad i{background:var(--bad-dot)}
.pm-ac{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.pm-row{grid-template-columns:1fr auto}.pm-bar{grid-column:1/-1;grid-row:2}.pm-ac{grid-column:1/-1;justify-content:flex-start}}
/* ---------- Modo Revisão (depois das metas) ---------- */
.mr-festa{position:fixed;inset:0;z-index:10000;background:rgba(6,14,24,.88);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .35s ease-out}
.mr-festa canvas{position:absolute;inset:0;pointer-events:none;z-index:0}
.mr-festa-card{position:relative;width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--gold-line);border-radius:20px;padding:26px 22px 20px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5);z-index:1;animation:pvpop .5s cubic-bezier(.2,.9,.3,1.2) 1.7s both}
@media (prefers-reduced-motion: reduce){.mr-festa-card{animation:none}}
.mr-festa-x{position:absolute;top:10px;right:10px}
.mr-trofeu{width:76px;height:76px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#E2BE68,#94701A);color:#0D1B2A;box-shadow:0 0 0 6px var(--gold-wash)}
.mr-trofeu svg{width:38px;height:38px}
.mr-festa-k{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink)}
.mr-festa-card h2{font-size:28px;line-height:1.15;margin:4px 0 8px;letter-spacing:-.02em}
.mr-festa-l{color:var(--ink-2);font-size:15px;line-height:1.5}
.mr-festa-n{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:14px 0}
.mr-festa-n div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 6px}
.mr-festa-n b{display:block;font-size:20px;font-weight:800}
.mr-festa-n span{font-size:11.5px;color:var(--muted)}
.mr-festa-on{background:var(--gold-wash);border:1px solid var(--gold-line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mr-festa-on b{display:flex;align-items:center;gap:8px;color:var(--gold-ink);font-size:15px}
.mr-festa-on b svg{width:18px;height:18px;flex:none}
.mr-festa-on span{font-size:14px;color:var(--ink-2);line-height:1.5}

    ad: null, initP: null, info: null, erro: null, _k: {}, _t: {},
    /* chave AES do conteúdo (OJ: só para quem tem o OJ ativo; Escrevente: só para aluno ativo) */
    async chave(produto) {
      produto = produto || this.PRODUTO_OJ;
      if (this._k[produto]) return this._k[produto];
      if (!this.ad || !this.ad.extraChave) throw new Error('sem acesso');

    },
    /* arquivo cifrado: "core", "questoes", "docs/m24", "leis/cpc" -> texto JSON (padrão: Oficial de Justiça) */
    texto(id, produto) {

      id = String(id).replace(/^data\//, '').replace(/\.json$/, '');
      const ch = produto + ':' + id;
      if (!this._t[ch]) this._t[ch] = (async () => {
        const k = await this.chave(produto);
        const r = await fetch(`extras/${produto}-${id.replace(/\//g, '--')}.bin`, { cache: 'no-cache' });
        if (!r.ok) throw new Error('arquivo ' + r.status);
        const buf = new Uint8Array(await r.arrayBuffer());
        const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, k, buf.slice(12));
        return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      })().catch(e => { delete this._t[ch]; throw e; });
      return this._t[ch];
    },
    /* troca de curso: guarda a escolha neste aparelho e reabre o app no curso novo */
    trocar(c, hash) { lsSet(c); location.hash = hash || 'inicio'; location.reload(); },
    escolhido() { return lsGet(); },
    async boot() {
      const CFG = window.PE_CONFIG || {};
      // link com ?curso=oj (página de obrigado e e-mail de boas-vindas do OJ): abre direto no curso pedido
      try { const q = new URLSearchParams(location.search).get('curso'); if (q === 'oj' || q === 'esc') lsSet(q); } catch (e) { }
      this.ojVisivel = !!this.OJ_LANCADO;
      if (!(CFG.supabase && window.SupabaseAdapter)) return; // visualização sem login (ou artefato): Escrevente, como sempre
      this.ad = window.SupabaseAdapter(CFG.supabase);
      this.initP = Promise.resolve().then(() => this.ad.init()).catch(() => null);
      const info = this.info = await this.initP;
      if (!info || !info.uid) return; // tela de login ou de acesso bloqueado (o próprio adaptador mostra)
      const c = info.cursos || { esc: true, oj: false };
      this.acesso = { esc: !!(c.esc || info.admin), oj: !!(c.oj || info.admin), admin: !!info.admin, local: false };
      this.ojVisivel = !!(this.OJ_LANCADO || this.acesso.admin || c.oj);
      // produção: o cronograma do Escrevente não vem na página; abre o cifrado (também serve ao Plano combinado de quem tem os dois)
      const el = document.getElementById('core');
      const escP = this.acesso.esc && el && !el.textContent.trim()
        ? this.texto('core', this.PRODUTO_ESC).then(t => { JSON.parse(t); this.coreEsc = t; }).catch(e => { console.warn('cronograma do Escrevente indisponível', e); this.erroEsc = e; })
        : Promise.resolve();
      let want = lsGet();
      if (want !== 'oj' && want !== 'esc') want = this.acesso.esc ? 'esc' : 'oj';
      if (want === 'oj' && !this.acesso.oj) want = 'esc';
      if (want === 'esc' && !this.acesso.esc) want = 'oj';
      if (want !== 'oj') { this.curso = 'esc'; await escP; return; }
      try {
        const t = await this.texto('core'); JSON.parse(t);
        document.getElementById('core-oj').textContent = t; this.curso = 'oj';
      } catch (e) {
        console.warn('conteúdo do Oficial de Justiça indisponível', e); this.erro = e;
        if (this.acesso.esc) { this.curso = 'esc'; this.avisoFalha = true; }
        else this.curso = 'falha';
      }
      await escP;
    },
    /* só tem o OJ e o conteúdo não abriu (sem conexão, por exemplo): não abre o Escrevente no lugar */
    telaFalha(c) {
      const d = document.createElement('div'); d.className = 'sheetbg';
      d.innerHTML = '<div class="sheet"><h2>Não consegui abrir o ' + (c === 'esc' ? 'seu plano de estudos' : 'Oficial de Justiça') + '</h2><p class="small ink2" style="margin-top:8px">Confira a sua conexão com a internet e tente de novo. Seu progresso está guardado na sua conta. Se continuar, escreva para suporte@protocoloescrevente.com.br.</p><div class="row" style="margin-top:12px"><button class="btn pri" id="pe-oj-retry">Tentar de novo</button></div></div>';
      document.body.appendChild(d); d.querySelector('#pe-oj-retry').onclick = () => location.reload();
    },
  };
})();

}
const POST = [];
let lastRoute = '';
function render(keepScroll) {
  const { r, p } = parseHash(); const main = $('#main'); if (!main) return;

  if (key !== lastRoute) { if (!backNav) { if (HIST[HIST.length - 1] !== key.replace(/\.$/, '')) HIST.push(key.replace(/\.$/, '')); if (HIST.length > 60) HIST.shift(); } else { HIST.push(key.replace(/\.$/, '')); } backNav = false; }

  let html = '';

  main.innerHTML = html;
  if (key !== lastRoute && !keepScroll) { window.scrollTo(0, 0); main.classList.remove('fade'); void main.offsetWidth; main.classList.add('fade'); }
  lastRoute = key;
  POST.splice(0).forEach(f => { try { f(); } catch (e) { console.error(e); } });
  labelTables(main);
  const nav = PARENT[r] || r;
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nav || (nav === 'leis' && a.dataset.nav === 'materiais' && a.closest('.tabbar')) || (nav === 'pq' && a.dataset.nav === 'questoes' && a.closest('.tabbar'))));

/* rótulos das colunas nas tabelas de dados: no celular cada linha vira um cartão (sem rolagem lateral) */
function labelTables(root) {
  $$('table.dtab', root).forEach(t => {
    if (t.dataset.lb) return; t.dataset.lb = '1';
    const hs = $$('thead th', t).map(th => th.textContent.trim());
    if (!hs.length) return;
    $$('tbody tr', t).forEach(tr => Array.from(tr.children).forEach((td, j) => { if (hs[j] && !td.hasAttribute('data-l')) td.setAttribute('data-l', hs[j]); }));
  });
}
let softPending = false;

}

const pdfLink = (src, label = 'PDF', name = '') => src ? `<a class="btn sm pdfbtn" href="${esc(src)}" target="_blank" rel="noopener" data-a="pdf-dl" data-src="${esc(src)}"${name ? ` data-name="${esc(name)}"` : ''}>${ico('pdf')}${esc(label)}</a>` : '';
/* PDFs para imprimir: gerados a partir do conteúdo revisado do app (resumos, lei seca e cronograma) */
const PRINT_DIR = 'pdf/imprimir/';
const safeName = s => String(s || '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150);
const docPdf = d => !CURSO.pdf ? '' : pdfLink(PRINT_DIR + d.id + '.pdf', 'PDF para imprimir', `Protocolo Escrevente - ${safeName(d.title)}.pdf`);
const leiPdf = l => !CURSO.pdf ? '' : pdfLink(PRINT_DIR + 'lei-' + l.id + '.pdf', 'PDF para imprimir', `Protocolo Escrevente - Lei seca - ${safeName(l.curto)}.pdf`);
/* PDF: dentro do app (artefato) o link em nova aba é bloqueado; então o arquivo é entregue pelo "salvar arquivo" do aparelho.
   Fora dele (site na Vercel), o link abre normalmente em nova aba. */
const pdfName = src => decodeURIComponent(String(src).split('/').pop()).replace(/(\.pdf)+$/i, '').replace(/[\\/:*?"<>|]+/g, ' ').trim() + '.pdf';
/* Na versão publicada (Vercel + Supabase) os PDFs ficam no Storage privado (bucket "conteudo", pasta arquivos/):
   só alunos ativos conseguem o link, que vale 1 hora. A chave é o caminho do PDF sem acentos e sem espaços. */
const pdfKey = src => 'arquivos/' + String(src).replace(/^\/+/, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9._\/-]+/g, '-').replace(/-+/g, '-');
ACT['pdf-dl'] = async (t, e) => {
  if ((typeof DL === 'undefined' || !DL) && CFG.supabase && window.PESupabase && /^\/?pdf\//.test(t.dataset.src || '')) {
    e.preventDefault(); if (t.dataset.busy) return; t.dataset.busy = '1';
    const w = window.open('', '_blank'); const old = t.innerHTML; t.innerHTML = `${ico('pdf')}Abrindo…`;
    try {
      const { data, error } = await window.PESupabase().storage.from('conteudo').createSignedUrl(pdfKey(t.dataset.src), 3600);
      if (error || !data) throw error || new Error('sem link');
      if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
    } catch (err) { if (w) w.close(); toast('Não consegui abrir o PDF agora. Confira sua conexão e tente de novo.'); }
    finally { t.innerHTML = old; delete t.dataset.busy; }
    return;
  }
  if (typeof DL === 'undefined' || !DL) return; // sem o recurso de download: o link segue para nova aba
  e.preventDefault();
  if (t.dataset.busy) return; t.dataset.busy = '1';
  const old = t.innerHTML; t.innerHTML = `${ico('pdf')}Preparando…`;
  try {
    const r = await fetch(t.dataset.src); if (!r.ok) throw { code: 'http', message: String(r.status) };
    const blob = await r.blob();
    await DL.save({ filename: t.dataset.name || pdfName(t.dataset.src), data: blob });
  } catch (err) {
    const c = err && err.code;
    if (c === 'declined') { /* a pessoa desistiu */ }
    else if (c === 'rate_limited') toast('Já existe um download aguardando confirmação.');
    else toast('Não consegui preparar o PDF agora. Tente de novo em instantes.');
  } finally { t.innerHTML = old; delete t.dataset.busy; }
};

   O aluno diz até qual meta chegou e em que período estudou. O app marca as metas como concluídas com
   datas espalhadas nesse período (as revisões nascem dessas datas) e, se ele quiser, dá como feitas as
   revisões que já venceram. Metas já marcadas no app não são alteradas. Dá para desfazer. */
const MIGR = { ate: 0, ini: '', fim: '', revs: true };
function migrPlano() {
  const t = TODAY(), P = prefs(), idx = SCHED.indexOf(+MIGR.ate);
  if (idx < 0 || !MIGR.ini || !MIGR.fim || MIGR.ini > MIGR.fim || MIGR.fim > t) return null;
  const alvo = SCHED.slice(0, idx + 1), novas = alvo.filter(n => !isDone(n));
  const dias = Math.max(0, Math.round((parseISO(MIGR.fim) - parseISO(MIGR.ini)) / 864e5));
  const plano = [], tot = alvo.length;
  let revFeitas = 0, revAbertas = 0, revAtras = 0;
  alvo.forEach((n, i) => {
    if (isDone(n)) return;
    const d = addDays(MIGR.ini, tot > 1 ? Math.round(dias * i / (tot - 1)) : dias);
    const r = {};
    if (META[n].tipo === 'meta') [1, 2, 3].forEach(k => {
      const due = addDays(d, +P.rev[k - 1] || [1, 7, 30][k - 1]);
      if (due < t && MIGR.revs) { r[k] = due; revFeitas++; } else if (due < t) revAtras++; else revAbertas++;
    });
    plano.push({ n, d, r });
  });
  return { plano, novas: novas.length, ja: alvo.length - novas.length, revFeitas, revAbertas, revAtras };
}

let readObs = null, readTimer = null;
function observeReading(key, sel, cb) {
  if (readObs) readObs.disconnect(); if (!('IntersectionObserver' in window)) return;
  readObs = new IntersectionObserver(ents => { const vis = ents.filter(e => e.isIntersecting).map(e => e.target); if (!vis.length) return; const id = vis[0].id; clearTimeout(readTimer); readTimer = setTimeout(() => cb(id), 2500); }, { rootMargin: '-80px 0px -60% 0px' });
  $$(sel).forEach(el => readObs.observe(el));
}

  S.tec.log.forEach(e => { if (e.c && inR(e.d, r)) add(+e.c, 't', +e.q || 0, +e.a || 0); });
  const B = BANK();
  if (B) { const mq = {}; B.q.forEach(q => { if (q.meta) mq[q.id] = q.meta; });
    for (const id in S.questoes.a) { const x = S.questoes.a[id], n = mq[id]; if (!n || !x || x.r === BLANK || !inR(x.d, r)) continue; add(n, 'i', 1, x.ok ? 1 : 0); if (!x.ok) by[n].err++; } }
  return Object.values(by).map(x => Object.assign(x, { q: x.tq + x.iq, a: x.ta + x.ia, p: pct(x.ta + x.ia, x.tq + x.iq) })).filter(x => x.q > 0);
}
function perfMetas(r) {

  if (ord === 'piores') ms.sort((a, b) => ((a.q < minQ) - (b.q < minQ)) || a.p - b.p || b.q - a.q); else ms.sort((a, b) => SCHED.indexOf(a.n) - SCHED.indexOf(b.n));
  const discs = [...new Set(perfMetaDados(r).map(x => META[x.n].d))];
  const lista = todas ? ms : ms.slice(0, 10);
  const linha = x => { const m = META[x.n], sm = semaf(x.p, x.q);
    return `<div class="pm-row"><a class="pm-meta" href="#meta.${x.n}"><span class="code">M${x.n}</span><span class="pm-tt"><b>${esc(discShort(m.d))}</b><span>${esc(short(topShort(m), 80))}</span></span></a>
      <div class="pm-bar"><div class="bar ${sm}"><i style="width:${x.p}%"></i></div><span class="xs muted">${x.a}/${x.q} acertos${x.iq && x.tq ? ` · ${x.iq} inéditas, ${x.tq} externas` : x.iq ? ' · inéditas' : ' · externas'}${x.q < minQ ? ' · poucas questões' : ''}</span></div>
      <div class="pm-st">${stPill(x.p, x.q)}</div>

  return `<section class="card" style="margin-top:14px"><div class="ch"><h2>Acerto por meta</h2><span class="sub">onde reforçar dentro de cada matéria · período selecionado</span></div>

}

function reportData() {
  const r = periodRange(UI.relP), st = periodStats(r), t = TODAY(), pc = pace(), L = Gamif.level();
  const doneAll = doneList();
  const pendRev = revList().filter(x => !x.at && x.due <= t);
  const errPend = S.erros.items.filter(x => !x.ok).length + Object.entries(S.questoes.a).filter(([id, a]) => a.r !== BLANK && a.ok === 0 && !S.erros.dom[id]).length;
  const tips = [];
  ORD.forEach(d => { const b = st.by[d]; const p = pct(b.a, b.q); if (b.q >= 10 && p < prefs().amarelo) tips.push(`${DISC[d].nome}: ${p}% de acerto em ${b.q} questões. Volte ao resumo e refaça as erradas antes de questões novas.`); });
  if (pc.perWeek && pc.perWeek < pc.metaSem * 0.7) tips.push(`Ritmo de ${pc.perWeek.toFixed(1).replace('.', ',')} metas por semana, abaixo da sua meta de ${pc.metaSem}. Nesse ritmo o cronograma termina em ${brY(pc.eta)}.`);
  if (pc.need != null && pc.perWeek && pc.need > pc.perWeek) tips.push(`Para fechar até ${brY(prefs().alvo)} você precisa de ${pc.need.toFixed(1).replace('.', ',')} metas por semana.`);
  if (pendRev.length) tips.push(`${plural(pendRev.length, 'revisão pendente', 'revisões pendentes')}. Faça as revisões antes do conteúdo novo.`);
  const nd = diffDays(r[0], r[1]) + 1, studyDays = Object.keys(activityDays()).filter(d => inR(d, r)).length;
  if (nd >= 7 && studyDays < nd * 0.6) tips.push(`Você estudou em ${studyDays} de ${nd} dias do período. Constância pesa mais que maratona.`);
  if (st.min && st.days && st.min / st.days < prefs().horas * 60 * 0.75) tips.push(`Média de ${fmtMin(st.min / st.days)} por dia com cronômetro, abaixo da meta de ${prefs().horas}h.`);
  if (errPend > 15) tips.push(`${errPend} itens pendentes no Banco de Erros. Reserve 30 minutos por dia para eles.`);
  if (CURSO.redacao && !st.red.length && nd >= 14) tips.push('Nenhuma redação no período. A redação é eliminatória: sem 20 dos 40 pontos, a nota da objetiva não conta. Faça uma por semana.');
  if (!tips.length) tips.push('Nenhum ponto crítico no período. Mantenha o ritmo e as revisões em dia.');
  return { r, st, doneAll, pendRev, errPend, tips, pc, L };
}

  xpFor(kind, obj) {

/* ---------- Resumo do aluno (painel do professor e ranking) ---------- */
const Progress = {
  timer: null,
  touch() { clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 4000); },
  summary() {
    const t = TODAY(), L = Gamif.level(), pc = pace(), ag = qAgg(), tec = tecAgg();
    const mins = minutesBy(); let h7 = 0, hAll = 0; for (const d in mins) { hAll += mins[d]; if (d >= addDays(t, -6)) h7 += mins[d]; }
    const last = Object.keys(activityDays()).filter(d => d <= t).sort().pop() || '';
    const lastSim = S.simulados.items.slice().sort((a, b) => a.d < b.d ? 1 : -1)[0];
    const byD = {}; ORD.forEach(d => { const q = (tec.by[d] || {}).q || 0, a = (tec.by[d] || {}).a || 0, x = ag.by[d] || { c: 0, e: 0 }; const tq = q + x.c + x.e; if (tq) byD[d] = pct(a + x.c, tq); });
    return { nome: S.perfil.nome || '', nick: prefs().nick || '', rank: !!prefs().rank, xp: L.xp, lvl: L.n, lvlNome: L.nome, metas: pc.doneN, marco: nextMetas(1)[0] ? META[nextMetas(1)[0]].marco : ((CORE.marcos || []).slice(-1)[0] || { n: 6 }).n, prox: nextMetas(1)[0] || null, ritmo: +pc.perWeek.toFixed(2), eta: pc.eta, n7: pc.n7, inicio: S.perfil.inicio || '', ultimo: last, streak: streak(), q: ag.n - ag.b, qPct: pct(ag.c, ag.c + ag.e), ext: tec.q, extPct: pct(tec.a, tec.q), h7: Math.round(h7), hAll: Math.round(hAll), revPend: revList().filter(x => !x.at && x.due <= t).length, errPend: S.erros.items.filter(x => !x.ok).length + Object.entries(S.questoes.a).filter(([id, a]) => a.r !== BLANK && a.ok === 0 && !S.erros.dom[id]).length, sims: S.simulados.items.length, simUlt: lastSim ? pct(lastSim.c, lastSim.total) : null, red: S.redacao.items.length, leis: Object.keys(S.leis.lida).length, badges: Object.keys(S.perfil.badges || {}).length, jg: typeof jgSemana === 'function' ? jgSemana() : 0, mrC: (S.modorev && S.modorev.on) ? (((S.modorev.ciclos || []).slice(-1)[0] || {}).n || 1) : 0, byD, upd: Date.now() };
  },
  async push() {
    if (!Store.canWrite || !Store.adapter || !Store.uid) return;
    const sm = this.summary();
    try { await Store.adapter.doc(`alunos/${CURSO.pre}${Store.uid}`).set(sm); } catch (e) { }
    try {
      const ref = Store.adapter.doc(`ranking/${CURSO.pre}${Store.uid}`);
      if (sm.rank && sm.nick) { const dl = {}; Object.entries(((S.jogos || {}).dl) || {}).forEach(([k, v]) => { if (/^[a-z]+-[0-9a-z]{1,7}$/.test(k) && v && Number.isFinite(+v.pts)) dl[k] = +v.pts; }); await ref.set({ nick: sm.nick, xp: sm.xp, lvl: sm.lvl, metas: sm.metas, streak: sm.streak, n7: sm.n7, upd: sm.upd, jg: sm.jg || 0, dl }); lsSet('rankPub', 1); }
      else if (lsGet('rankPub')) { await ref.delete(); lsSet('rankPub', 0); }
    } catch (e) { }
    if (typeof Lembrete !== 'undefined') Lembrete.sync().catch(() => { }); // revisões pendentes para o lembrete no celular
  },
};

/* Dados escritos pelo app de outros alunos (ranking/alunos): só números, datas e textos simples, para nada virar HTML. */
const ALUNO_NUM = ['mrC', 'jg', 'lvl', 'xp', 'metas', 'marco', 'prox', 'ritmo', 'n7', 'streak', 'q', 'qPct', 'ext', 'extPct', 'h7', 'hAll', 'revPend', 'errPend', 'sims', 'simUlt', 'red', 'leis', 'badges', 'upd'];
function limpaAluno(r) {
  const o = Object.assign({}, r); o.id = String(o.id == null ? '' : o.id);
  ALUNO_NUM.forEach(k => { if (o[k] != null) { const n = +o[k]; o[k] = Number.isFinite(n) ? n : null; } });
  ['eta', 'inicio', 'ultimo'].forEach(k => { if (o[k] != null && !/^\d{4}-\d{2}-\d{2}$/.test(String(o[k]))) o[k] = ''; });
  ['nome', 'nick', 'lvlNome'].forEach(k => { if (o[k] != null) o[k] = String(o[k]).slice(0, 80); });
  const dl = {}; if (o.dl && typeof o.dl === 'object') Object.keys(o.dl).slice(0, 40).forEach(k => { const n = +o.dl[k]; if (/^[a-z]+-[0-9a-z]{1,7}$/.test(k) && Number.isFinite(n)) dl[k] = n; }); o.dl = dl;
  const b = {}; if (o.byD && typeof o.byD === 'object') Object.keys(o.byD).forEach(d => { const n = +o.byD[d]; if (Number.isFinite(n)) b[d] = n; }); o.byD = b;
  return o;
}

/* ---------------- COMPARTILHAR CONQUISTA ----------------

const Compart = {
  W: 1080, H: 1920, blob: null, url: '', opt: null,
  site() { return /protocoloescrevente\.com\.br$/.test(location.hostname) ? location.origin : 'https://app.protocoloescrevente.com.br'; },
  link() { return this.site() + (CURSO.id === 'esc' ? '/vendas' : ''); },
  host() { return this.site().replace(/^https?:\/\//, ''); },
  dados(opt) {
    const L = Gamif.level(), ag = qAgg(), tec = tecAgg();
    const b = opt && opt.badge ? Gamif.BADGES.find(x => x.id === opt.badge) : null;
    return { L, b, metas: doneList().length, seq: streak(), q: (ag.n - ag.b) + tec.q };
  },
  legenda(opt) {

    return d.b ? `Mais um passo na preparação para ${cargo}: conquista "${d.b.nome}" desbloqueada no app do Protocolo. Conheça: ${this.link()}`

  },
  arquivo(opt) { return `protocolo-${opt && opt.badge ? 'conquista-' + opt.badge : 'evolucao'}.png`; },
  async gerar(opt) {

    const SANS = '"Public Sans", "Helvetica Neue", Arial, sans-serif', SERIF = '"Literata", Georgia, serif';
    const GOLD = '#C49B36', GOLD2 = '#E2BE68', NAVY = '#0D1B2A', TXT = '#F3F5F8', MUT = '#9FB0C3';
    const rr = (x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
    const espacado = (txt, x, y, esp) => { const ch = [...txt], w = ch.reduce((s, k) => s + c.measureText(k).width, 0) + esp * (ch.length - 1); let cx = x - w / 2; c.textAlign = 'left'; ch.forEach(k => { c.fillText(k, cx, y); cx += c.measureText(k).width + esp; }); c.textAlign = 'center'; };
    const linhas = (txt, max) => { const out = []; let cur = ''; String(txt).split(/\s+/).forEach(p => { const t = cur ? cur + ' ' + p : p; if (cur && c.measureText(t).width > max) { out.push(cur); cur = p; } else cur = t; }); if (cur) out.push(cur); return out; };
    // fundo navy com brilho dourado atrás da medalha e moldura fina
    let g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0A1622'); g.addColorStop(1, '#14283E'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    g = c.createRadialGradient(540, 700, 30, 540, 700, 760); g.addColorStop(0, 'rgba(196,155,54,.30)'); g.addColorStop(1, 'rgba(196,155,54,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(196,155,54,.55)'; c.lineWidth = 3; rr(44, 44, W - 88, H - 88, 36); c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillStyle = GOLD; c.font = `800 34px ${SANS}`; espacado('PROTOCOLO', 540, 180, 12);
    c.fillStyle = TXT; c.font = `800 66px ${SANS}`; c.fillText(CURSO.brand, 540, 262);
    c.fillStyle = MUT; c.font = `500 30px ${SANS}`; c.fillText(CURSO.brandSub, 540, 312);
    // medalha
